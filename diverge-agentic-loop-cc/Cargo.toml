[package]
name = "diverge-agentic-loop-cc"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The ClaudeCode agentic_loop container of the Diverge provider protocol"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[dependencies]
# The continuation token's outer coat: JSON, base64-ified.
base64 = { version = "0.22.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# `fs` for writing the continuation's files; the runtime itself comes
# with the harness.
tokio = { version = "1.53.1", default-features = false, features = ["fs"] }
