[package]
name = "identity-diverge-network"
version = "0.1.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "A Diverge tool container: accounts at identity.diverge.network, kept, and identities signed in on the daemon as them"
license = "MIT"
repository = "https://github.com/divergenetwork/Diverge"
homepage = "https://diverge.network"
publish = false

[[bin]]
name = "identity-diverge-network"
path = "src/main.rs"

[dependencies]
# The SDK, by path: the container's contract with the proxy beside it
# (registration, secrets, the daemon, Postgres), the daemon's login
# the tool asks for, and what an account at identity.diverge.network
# is — its issuers, its tokens kept good, and the approval of a login.
diverge-sdk = { path = "../../diverge-sdk-rs" }
# The program's door: an HTTP server on the loopback the proxy dials,
# `/register`, the secrets' two paths, and the MCP server at `/mcp`.
axum = { version = "0.8.9" }
# The MCP server, over Streamable HTTP; the same version the SDK's
# content blocks are written against.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
# Each tool's parameters state their own JSON Schema; `--schema`
# states the arguments'.
schemars = { version = "1.2.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The accounts: the tool's database, through the proxy's loopback
# pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
# The client an account's issuer, and identity.diverge.network, are
# asked with: the one the SDK's functions take.
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls", "json"] }
# The login's answers, read as a stream.
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
# The runtime under the listener, and the lazily made pool and daemon
# connection.
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt-multi-thread", "sync"] }
