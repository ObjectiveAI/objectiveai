[package]
name = "objectiveai-tests-pg-installer"
version = "2.0.11"
edition = "2024"
publish = false
description = "Test-only helper: extracts the bundled postgres archive into a passed-in directory so per-test cli children share one install via symlinks instead of each paying the ~163M extract cost."

[dependencies]
postgresql_embedded = { version = "0.20", default-features = false, features = ["bundled", "theseus", "tokio", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
anyhow = "1"
