[package]
name = "objectiveai-provider-sdk"
version = "2.2.15"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "Wire types for the ObjectiveAI provider API — the normative artifact of the provider specification"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-provider-sdk"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "provider"]
publish = true

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
rmcp = { version = "3.1.2", default-features = false }
rust_decimal = { version = "1.40.0", features = ["serde-float", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
