[package]
name = "diverge-provider-sdk"
version = "2.2.15"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "Wire types for the Diverge provider API — the normative artifact of the provider specification"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
documentation = "https://docs.rs/diverge-provider-sdk"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "provider"]
publish = true

[features]
# The provider half. Off by default so a client, and a tool that only
# inspects the protocol, compiles messages and nothing else.
server = ["dep:axum"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# `ws` and nothing else. It brings tokio, hyper, tokio-tungstenite,
# sha1 and base64 — the handshake and the socket — and deliberately not
# http1 or http2, so nothing here can serve HTTP. A provider does the
# serving and hands over an upgraded socket.
axum = { version = "0.8.9", default-features = false, features = ["ws"], optional = true }
indexmap = { version = "2.14.0", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"], default-features = false }
rmcp = { version = "3.1.2", default-features = false }
rust_decimal = { version = "1.40.0", features = ["serde-float", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
