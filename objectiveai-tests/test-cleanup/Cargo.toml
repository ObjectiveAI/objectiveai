[package]
name = "objectiveai-test-cleanup"
version = "0.0.0"
edition = "2024"
description = "Reset the repo's shared test OBJECTIVEAI_DIR: kill lockfile owners + leaked repo-built processes, wipe transient state"
publish = false

[dependencies]
objectiveai-sdk = { path = "../../objectiveai-sdk-rs", version = "2.1.2", default-features = false, features = ["lockfile"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1.50.0", features = ["rt", "macros"] }
