[package]
name = "objectiveai-db"
version = "2.2.14"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "ObjectiveAI database server — embedded PostgreSQL provisioning vehicle"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-db"
readme = "README.md"
keywords = ["postgresql", "database", "embedded", "objectiveai"]
publish = true

[dependencies]
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.2.14", default-features = false, features = ["lockfile", "subprocess-reaper"] }
clap = { version = "4.6.0", features = ["derive"] }
postgresql_embedded = { version = "0.20", default-features = false, features = ["bundled", "theseus", "tokio", "rustls"] }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "process"] }

# The OS-level "die with the parent" leash (job object / PR_SET_PDEATHSIG /
# kqueue guardian) now lives in objectiveai-sdk's `subprocess-reaper`
# feature, so this crate no longer needs nix / windows-sys directly.
