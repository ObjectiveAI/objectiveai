<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewer-notify</title>
  </head>
  <body>
    <p>viewer-notify test plugin</p>
    <script>
      // Integration-test plugin. The moment the host forwards a `notify`
      // inbound event (a POST to /plugin/viewer-notify/notify on the
      // viewer's embedded server), apply an agent tag via the viewer →
      // cli reverse channel. The tag's mere existence is the proof the
      // notification was received: the test verifies it by enqueuing a
      // message to the tag (`agents enqueue --agent-tag`, which errors
      // TagNotFound until the tag exists).
      //
      // This is the raw protocol the `@objectiveai/sdk/viewer`
      // `listen()` + `invokeCliRequest()` helpers wrap — kept inline
      // here so the fixture needs no build step. `plugin-bridge.ts`
      // forwards inbound events as the `{kind:"plugin-event", ...}`
      // message below and accepts `{kind:"cli-execute", request}` back.
      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (
          !msg ||
          msg.kind !== "plugin-event" ||
          msg.type !== "inbound" ||
          msg.sub_type !== "notify"
        ) {
          return;
        }
        // The test puts a unique tag name in the notification body so
        // each run uses a fresh tag; fall back to a fixed name.
        const tag =
          (msg.value && msg.value.tag) || "viewer-notify-received";
        // Typed `cli::command::Request` (internally tagged on
        // `path_type`); the host lowers it to argv via `into_command()`.
        // A bound tag → AIH needs no live agent / no agent spec.
        window.parent.postMessage(
          {
            kind: "cli-execute",
            request: {
              path_type: "agents/tags/apply",
              name: tag,
              target: { by: "agent_instance", agent_instance: "received" },
            },
          },
          "*",
        );
      });
    </script>
  </body>
</html>
