[package]
name = "test-mcp-plugin-named"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "test-mcp-plugin-named"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
