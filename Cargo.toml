[workspace]
resolver = "3"
members = [
    "objectiveai-api",
    "objectiveai-db",
    "objectiveai-mcp",
    "objectiveai-mcp-filesystem",
    "objectiveai-mcp-proxy",
    "objectiveai-sdk-rs",
    "objectiveai-json-schema/builder",
    "objectiveai-sdk-rs-wasm-js",
    "objectiveai-sdk-rs-macros",
    "objectiveai-sdk-rs-pyo3",
    "objectiveai-sdk-rs-cffi", "objectiveai-cli",
    # Integration-test fixture crates — plugin and tool stubs the cli
    # integration tests build and exec. Grouped under tests/ by kind:
    # plugins under tests/plugins/, tools under tests/tools/.
    "tests/plugins/test-mcp-plugin-named",
    "tests/plugins/hello-plugin",
    "tests/plugins/test-mcp-plugin",
    "tests/plugins/test-mcp-plugin-failing",
    "tests/plugins/test-mcp-plugin-foo-headers",
    "tests/tools/count-tool",
    "tests/tools/hello-tool",
    "tests/tools/error-tool",
    "objectiveai-viewer/src-tauri",
    "tests/objectiveai-tests",
]

[workspace.metadata.tools]
wasm-pack = "0.14.0"
maturin = "1.12.6"
cargo-nextest = "0.9.137"
