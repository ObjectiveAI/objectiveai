[workspace]
resolver = "3"
members = [
    "objectiveai-api",
    "objectiveai-db",
    "objectiveai-db-proxy",
    "objectiveai-laboratory",
    "objectiveai-mcp-laboratory",
    "objectiveai-mcp-proxy",
    "objectiveai-mcp-plugin-framework-rs",
    "objectiveai-sdk-rs",
    "objectiveai-json-schema/builder",
    "objectiveai-sdk-rs-wasm-js",
    "objectiveai-sdk-rs-macros",
    "objectiveai-sdk-rs-pyo3",
    "objectiveai-sdk-rs-cffi", "objectiveai-daemon", "objectiveai-cli",
    # Integration-test fixture crates — plugin stubs the cli
    # integration tests build and exec, grouped under tests/plugins/.
    "tests/plugins/test-mcp-plugin-named",
    "tests/plugins/hello-plugin",
    "tests/plugins/test-mcp-plugin",
    "tests/plugins/test-mcp-plugin-self-call",
    "tests/plugins/test-mcp-plugin-failing",
    "tests/plugins/daemon-echo-plugin",
    "tests/plugins/stderr-plugin",
    "objectiveai-viewer/src-tauri",
    "tests/objectiveai-tests",
    "tests/objectiveai-api-tests",
    "tests/objectiveai-cli-tests",
]

exclude = [
    # Built only for wasm32-wasip1 by objectiveai-daemon/build.rs — excluded so
    # the host-target workspace build never tries to compile its wasm-only host
    # import.
    "objectiveai-rustpython-wasm",
    # A template that gets COPIED OUT and built on its own, so its manifest is
    # exactly what a standalone plugin needs — plain registry versions, no path
    # to a checkout that will not be there. Which means it does not resolve
    # here, since the crates it names are this branch's unpublished versions.
    # Excluded rather than patched: a `[patch.crates-io]` redirecting those
    # names at local checkouts would make it build, but only by making the
    # in-repo copy resolve differently from the copy a user takes away — and
    # the whole point of the folder is that it is naked.
    "objectiveai-mcp-plugin-scaffold-rs",
]

[workspace.metadata.tools]
wasm-pack = "0.14.0"
maturin = "1.12.6"
