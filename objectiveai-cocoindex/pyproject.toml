[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "objectiveai-cocoindex"
version = "2.2.7"
description = "ObjectiveAI integration for CocoIndex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "ObjectiveAI", email = "admin@objectiveai.dev" },
]
keywords = ["objectiveai", "cocoindex", "ai", "llm", "indexing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "objectiveai-sdk==2.2.7",
  "cocoindex",
]

[project.urls]
Homepage = "https://objectiveai.dev"
Repository = "https://github.com/ObjectiveAI/objectiveai"
Issues = "https://github.com/ObjectiveAI/objectiveai/issues"

[tool.hatch.build.targets.wheel]
packages = ["objectiveai_cocoindex"]

[tool.hatch.build.targets.sdist]
include = [
  "objectiveai_cocoindex/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
