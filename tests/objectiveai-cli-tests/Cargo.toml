[package]
name = "objectiveai-cli-tests"
version = "2.2.3"
edition = "2024"
description = "Integration tests for objectiveai-cli (drives the installed cli shim end-to-end)"
publish = false

# The integration suite lives under tests/; this crate's src/ is an
# empty library target to hang it off. All deps are dev-only.
[dev-dependencies]
objectiveai-sdk = { path = "../../objectiveai-sdk-rs", features = ["lockfile", "subprocess-reaper"] }
objectiveai-daemon = { path = "../../objectiveai-daemon" }
# Used by schema_commands_e2e to walk the cli's clap command tree
# (CommandFactory) and enumerate request-schema / response-schema commands.
clap = { version = "4.6.0", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["io-util", "sync"] }
futures = "0.3.32"
# agents_message_lock_held_e2e reads the /agents/instances/list SSE
# deltas RAW — its rising-edge assertions need per-event delivery,
# which the SDK's materialized (watch-coalesced) listener can't
# guarantee.
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6.0"
axum = "0.8.8"
insta = { version = "1.40", features = ["json"] }
uuid = { version = "1.22", features = ["v4"] }
wiremock = "0.6"
notify = "8.2"
