[package]
name = "objectiveai-api-tests"
version = "2.2.3"
edition = "2024"
description = "Integration tests for objectiveai-api (drives a spawned api server over HTTP)"
publish = false

# The integration suite lives under tests/; this crate's src/ is an
# empty library target to hang it off. All deps are dev-only.
[dev-dependencies]
objectiveai-sdk = { path = "../../objectiveai-sdk-rs", default-features = false, features = ["http", "mcp", "lockfile", "subprocess-reaper"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
indexmap = { version = "2.13.0", features = ["serde"] }
rust_decimal = { version = "1.40.0", features = ["macros", "serde-float", "rand", "maths"] }
tokio = { version = "1.50.0", features = ["full"] }
futures = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json"] }
regex = "1.12.3"
rmcp = { version = "0.16.0", features = ["server", "transport-streamable-http-server"] }
dunce = "1.0.5"
walkdir = "2.5.0"
axum = "0.8.8"
tokio-util = { version = "0.7.18", features = ["io"] }
base64 = "0.22.1"
