[package]
name = "objectiveai-development-launcher"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace — NOT a member of the main workspace, so the root
# `cargo build` / `cargo test` doesn't see this crate.
[workspace]

[dependencies]
# std only.

# The release binary is committed to git (five copies under
# `.objectiveai/bin/*.exe`) — squeeze it as small as possible.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
