[package]
name = "diverge-provider-server"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The reference provider of the Diverge provider protocol — a server that serves callers as the specification requires"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "diverge-provider-server"
path = "src/main.rs"

[dependencies]
# Path-only: this crate rides the workspace and is never published, so
# the SDK is named by where it lives rather than by a version pin
# version.sh would have to chase. `server` is the half that holds the
# socket and hands this crate the scopes to serve.
diverge-provider-sdk = { path = "../diverge-provider-sdk-rs", default-features = false, features = ["server"] }
# The volume cache: one lock per identity and per name, so callers
# of different volumes never wait on each other.
dashmap = "6.2.1"
# `Stream`, the shape a volume's watch is handed back as; `alloc` for
# the join utilities the cache fans out with.
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
# A volume's dirhash, as the specification defines it: SHA-256 of a
# manifest of SHA-256s, each written base64url without padding.
sha2 = "0.10.9"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
# `sync` for the per-volume locks and the once-only loads; `rt` for
# the pool `tokio::fs` hands every read to.
tokio = { version = "1.53.1", features = ["process", "io-util", "fs", "sync", "rt"] }
