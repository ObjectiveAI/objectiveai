[package]
name = "diverge-daemon"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The Diverge daemon — the server of the daemon protocol: its records in the Postgres it serves, its accounts and roles, and the judgment of every request"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "diverge-daemon"
path = "src/main.rs"

[dependencies]
# Path-only: this crate rides the workspace and is never published, so
# the SDK is named by where it lives rather than by a version pin
# version.sh would have to chase.
diverge-sdk = { path = "../diverge-sdk-rs" }
# A directory resource's id is `h1:` and the base64 of a hash.
base64 = "0.22.1"
# The MCP types a container's tool calls carry: what the served
# tools answer, merged.
rmcp = { version = "3.1.2", default-features = false }
# The pgwire client side of a container's database connection: the
# startup message the daemon sends as the container's role, the
# SCRAM-SHA-256 and md5 answers, the backend messages parsed, and the
# SCRAM verifier a role is made with.
postgres-protocol = "0.6.12"
# The iterator trait `postgres-protocol`'s lists — the SASL
# mechanisms offered, an error's fields — are walked with; its
# version, which the trait is tied to.
fallible-iterator = "0.2.0"
# TLS toward a remote database, by the URL's `sslmode`.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"
# A remote URL answered without its password, and read for where to
# dial; its user and database decoded.
url = "2.5.8"
percent-encoding = "2.3.2"
# The socket: a WebSocket upgrade accepted at any path on the port.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
# The one frame the daemon reads off a socket itself: the credential,
# to tell a client from a provider before either half is built.
bytes = { version = "1.11.1", default-features = false }
# The time a record was made, as Postgres keeps it and the wire
# carries it.
chrono = { version = "0.4.39", default-features = false, features = ["std", "clock", "serde"] }
# `StreamExt`, for the session's scopes as they arrive.
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
# A minted key, and its hash, as text.
hex = "0.4.3"
# The bytes of a minted key.
rand = { version = "0.9.2", default-features = false, features = ["std", "std_rng", "os_rng"] }
# The one error every refusal carries, as JSON; and what a record
# keeps as JSON — a creator, a role's grants. `config.yaml` is the
# SDK's to read.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The hash a credential is kept and looked up by: a key is compared
# as its SHA-256, so the key itself is nowhere on disk.
sha2 = "0.10.9"
# The records, in Postgres. Runtime queries alone — no macros, so no
# database at build time — over tokio with rustls; `chrono` and `json`
# for the columns of those types.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
# The outgoing socket: `connect` is how the daemon dials a provider.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
# The name of the directory an upload is received into, before its
# hash is known.
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }
# `net` for the port; `fs` for the directory; `process` and `io-util`
# for the local Postgres beside the daemon and its two stdio lines;
# `time` for how long its stop is given; `signal` for Ctrl-C and
# SIGTERM; `rt-multi-thread` and `sync` for the runtime `main` builds
# and the stop flag.
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "sync", "rt", "rt-multi-thread", "net", "signal", "time"] }
