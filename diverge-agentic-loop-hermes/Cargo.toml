[package]
name = "diverge-agentic-loop-hermes"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The Hermes agentic_loop container of the Diverge provider protocol"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[dependencies]
# The loop's face: a WebSocket at `/`, the Container specification's
# surface. Default features carry the JSON extractor and the HTTP/1
# server; `ws` the socket.
axum = { version = "0.8.9", features = ["ws"] }
# The resource store's map: sharded by key, so concurrent deliveries
# of different identities append in parallel instead of queuing on
# one mutex.
dashmap = { version = "6.2.1" }
# Path-only: this crate rides the workspace and is never published, so
# the SDK is named by where it lives rather than by a version pin
# version.sh would have to chase.
diverge-provider-sdk = { path = "../diverge-provider-sdk" }
# The continuation's outbound stream, as a generator.
async-stream = { version = "0.3.6" }
# `Stream` and its combinators, for the chunk stream the response is.
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
# The SSE parser over the gateway's event stream: comments dropped,
# data frames surfaced, no reconnect of its own.
eventsource-stream = { version = "0.2.3" }
# The HTTP client for the gateway's API server, on loopback: no TLS,
# `json` for the request and the 202, `stream` for the events body.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
# The derives under the response module — the gateway's run-event
# vocabulary is read with them — and under run::raw's request.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The continuation's database harvest: fold the WAL, VACUUM, prove a
# delivered `state.db` opens. The async SQLite driver on tokio with
# the vendored libsqlite3 (`sqlite` = sqlx-sqlite/bundled — compiles
# sqlite3.c with cc, no bindgen, no system library); no TLS, no
# postgres, no macros. Version: the workspace lock's, confirmed by
# `cargo info sqlx`.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
# The API server key: two v4 uuids, minted per run.
uuid = { version = "1.22.0", features = ["v4"] }
# The runtime under the listener, `sync` for the Notify the stores
# wake their collectors with, `fs` + `io-util` for the continuation's
# files, read and appended a piece at a time. No `macros` — the
# runtime is built in main, not attributed onto it.
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "net", "rt-multi-thread", "sync"] }
