[package]
name = "diverge-agentic-loop-mcp-proxy"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The MCP server inside an agentic_loop container — MCP over WebSocket, relayed to the caller's servers"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[dependencies]
# `ws` on top of the defaults: one listener serves the WebSocket at `/`
# and the MCP server at `/mcp`, and axum's upgrade is the listener half
# the wire needs.
axum = { version = "0.8.9", features = ["ws"] }
# What a WebSocket message carries, and what a channel's responses are
# routed as — sliced out of the frame they arrived in, not copied.
bytes = { version = "1.11.1", default-features = false }
# Path-only: this crate rides the workspace and is never published, so
# the SDK is named by where it lives rather than by a version pin
# version.sh would have to chase.
diverge-provider-sdk = { path = "../diverge-provider-sdk" }
# `Sink`/`Stream` on the split socket.
futures-util = { version = "0.3.33", default-features = false }
# The MCP server the agent talks to: a compliant Streamable HTTP
# server whose handler is this crate's relay.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
# The queue's answer types serialize; the derive is the whole need.
serde = { version = "1.0.229", features = ["derive"] }
# Named for the encode failure `open` reports; the JSON itself is the
# SDK's business.
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
# The correlation key: the folded tool response's text, hashed.
sha2 = { version = "0.10.9" }
# The runtime under the listener. No `macros` — the runtime is built in
# main, not attributed onto it.
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt-multi-thread", "sync"] }
