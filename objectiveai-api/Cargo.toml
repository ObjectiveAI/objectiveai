[package]
name = "objectiveai-api"
version = "2.2.15"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "ObjectiveAI API Server"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-api"
readme = "README.md"
keywords = ["llm", "ai", "swarm"]
publish = true
# Exclude the 72M `assets/` test-snapshot tree from the published
# tarball -- crates.io has a 10MB upload cap. Snapshots only matter
# for running the in-repo tests, not for consumers compiling the
# library. tests/ is also excluded for the same reason.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "build.rs",
    "README.md",
    "LICENSE*",
]

[dependencies]
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.2.15", default-features = false, features = ["http", "mcp", "subprocess-reaper"] }
objectiveai-mcp-proxy = { path = "../objectiveai-mcp-proxy", version = "2.2.15" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = { version = "2.13.0", features = ["serde"] }
json-escape = { version = "0.3.1" }
rust_decimal = { version = "1.40.0", features = ["macros", "serde-float", "rand", "maths"] }
thiserror = {  version = "2.0.18" }
serde_path_to_error = { version = "0.1.20" }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json"] }
reqwest-eventsource = { version = "0.6.0" }
eventsource-stream = { version = "0.2.3" }
futures = { version = "0.3.32" }
dashmap = { version = "6.1.0" }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
async-stream = { version = "0.3.6" }
async-trait = { version = "0.1.89" }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
backoff = { version = "0.4.0", features = ["tokio"] }
rand = { version = "0.9.2" }
regex = { version = "1.12.3" }
tokio-stream = { version = "0.1.18", features = ["io-util", "sync"] }
either = { version = "1.15.0" }
ahash = { version = "0.8.12" }
envconfig = { version = "0.11.1" }
dotenv = { version = "0.15.0" }
axum = { version = "0.8.8", features = ["ws"] }
tower-http = { version = "0.6.8", features = ["cors"] }
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2"] }
dirs = "6.0.0"
twox-hash = { version = "2.1.2" }
base62 = { version = "2.2.4" }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
futures-util = { version = "0.3.32" }
base64 = { version = "0.22.1" }
tempfile = { version = "3.27.0" }
percent-encoding = { version = "2.3.2" }

[dev-dependencies]
dunce = "1.0.5"
regex = "1.12.3"
walkdir = "2.5.0"
