# The specification site, served static. One server on 8080 — the
# unprivileged nginx image's port — from the build's dist/. Every
# page is a directory with an index.html and a Markdown twin beside
# it; trailing slashes are canonical, so a directory asked for
# without one is sent to it.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/markdown text/plain text/css text/xml application/xml image/svg+xml;
    server_tokens off;
    # Redirects name the path only: whatever host and scheme the
    # request arrived under is the one it goes back to.
    absolute_redirect off;

    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }

    # The site ships no script, and the policy says so to the browser:
    # inline styles only (Astro's global sheet and Shiki's spans), the
    # favicon from here, nothing else from anywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/markdown text/plain application/xml image/svg+xml;

    error_page 404 /404.html;

    # Hashed assets never change under their name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
}
