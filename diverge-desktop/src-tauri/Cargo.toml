[package]
name = "diverge-desktop"
version = "0.1.0"
edition = "2024"
description = "The Diverge desktop app, draft one"
publish = false

[dependencies]
# The seam. The daemon's own types, with the caller half of the wire
# linked so `WireDaemon` has nothing to add but itself.
diverge-daemon-sdk = { path = "../../diverge-daemon-sdk-rs", features = ["client"] }
# The pieces the daemon's types are made of (chunks, errors, filetree),
# and `schemars` so the six images' settings compile into schemas.
diverge-provider-sdk = { path = "../../diverge-provider-sdk-rs", features = ["schemars"] }
rmcp = { version = "3.1.2", default-features = false }

tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3.32"
async-trait = "0.1.89"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
schemars = { version = "1.2.1", features = ["indexmap2"] }
indexmap = { version = "2.14.0", features = ["serde"] }
dirs = "6.0.0"
notify = "8.2.0"
# The stand-in daemon runs a logs request's `jq` the way the daemon
# does (objectiveai-daemon/src/filesystem/jq.rs, same versions).
jaq-core = "2.2.1"
jaq-std = "2.1.2"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
# Our view types write their own TypeScript: `cargo test` exports them.
ts-rs = { version = "11", features = ["serde-json-impl"] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
# Virtual time, so the preview snapshot can catch a run part-way through.
tokio = { version = "1.50.0", features = ["full", "test-util"] }
