[package]
name = "diverge-desktop-room"
version = "0.1.0"
edition = "2024"
description = "The Diverge desktop app's room program: one room's verbs, seals and record. Ours, not the SDK's."
publish = false

[dependencies]
# The MCP model the room speaks, at the version Ronald's workspace pins.
rmcp = { version = "3.1.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
indexmap = { version = "2.14.0", features = ["serde"] }
tokio = { version = "1.50.0", features = ["sync"] }
# Seals: a key per person and per agent, made and kept on their own Mac.
ed25519-dalek = "2"
sha2 = "0.10"
# Accounts: SLIP-10 derivation of the root from the recovery words' seed,
# and wiping what it leaves in memory.
hmac = "0.12"
zeroize = "1"
hex = "0.4"
getrandom = "0.2"
# Words sealed to someone (a profile's notes and hires): X25519 to agree a
# key, HKDF to draw it, ChaCha20-Poly1305 to seal. All three were already
# in the build; curve25519-dalek is what ed25519-dalek stands on.
curve25519-dalek = "4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# The room as a tool container image (feature `image`): an HTTP server on
# the container's loopback, answering Ronald's proxy.
diverge-sdk = { path = "../../diverge-sdk-rs", optional = true }
axum = { version = "0.8.9", optional = true }

[features]
image = ["dep:diverge-sdk", "dep:axum", "rmcp/server", "rmcp/transport-streamable-http-server", "tokio/full"]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.50.0", features = ["full"] }

[[bin]]
name = "diverge-desktop-room"
required-features = ["image"]
