[package]
name = "diverge-desktop-room"
version = "0.1.0"
edition = "2024"
description = "The Diverge desktop app's room program: one room's verbs, seals and record. Ours, not the SDK's."
publish = false

[dependencies]
# The MCP model the room speaks, at the version Ronald's workspace pins.
rmcp = { version = "3.1.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
indexmap = { version = "2.14.0", features = ["serde"] }
tokio = { version = "1.50.0", features = ["sync"] }
# Seals: a key per person and per agent, made and kept on their own Mac.
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
