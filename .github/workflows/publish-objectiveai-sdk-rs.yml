name: Publish objectiveai-sdk-rs

# Publishes the `objectiveai-sdk` crate to crates.io. Triggered manually via
# workflow_dispatch.
#
# Setup required (one-time):
#   - CARGO_REGISTRY_TOKEN: crates.io API token with `publish-update` scope.
#     Generate at https://crates.io/me. Save as a repo secret.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish -p objectiveai-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Stage JSON schemas into the crate
        # build.rs needs the schemas at build time; the sibling
        # objectiveai-json-schema directory is not part of the published
        # tarball, so copy them into objectiveai-sdk-rs/schemas/ where
        # build.rs finds them as a packaged fallback and the Cargo
        # `include` field bundles them.
        run: |
          mkdir -p objectiveai-sdk-rs/schemas
          cp objectiveai-json-schema/*.json objectiveai-sdk-rs/schemas/

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the schemas/ directory is staged by the previous
        # step and is gitignored, so cargo would otherwise refuse to
        # publish with "untracked changes."
        run: cargo publish --allow-dirty -p objectiveai-sdk
