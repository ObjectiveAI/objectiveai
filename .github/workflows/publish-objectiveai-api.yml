name: Publish objectiveai-api

# Publishes the `objectiveai-api` crate to crates.io. Triggered manually via
# workflow_dispatch.
#
# Depends on `objectiveai` being on crates.io at the same version. If you
# bump versions, publish `objectiveai` first (or rerun this workflow once
# the upstream version has propagated, which can take a few seconds).
#
# Setup required (one-time):
#   - CARGO_REGISTRY_TOKEN: crates.io API token with `publish-update` scope.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish -p objectiveai-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --no-verify: build.rs unconditionally reaches into both
        # ../objectiveai-claude-agent-sdk-runner/ and
        # ../objectiveai-codex-sdk-runner/ (not part of the published
        # tarball). The workspace is already type-checked before this
        # publish runs.
        run: cargo publish --no-verify -p objectiveai-api
