name: Auto-publish libraries

# Fires on every push to main. If the version in
# objectiveai-sdk-rs/Cargo.toml is not yet on crates.io as
# `objectiveai-sdk@<version>`, this orchestrator runs the 6-wave
# dependency chain below and rolls out every library to its registry.
#
# Wave map:
#   1. sdk-rs-macros (crates), sdk-go (git tag — versioned independently
#      by objectiveai-sdk-go/version.txt, not the canonical version)
#   2. sdk-rs (crates)             — needs macros
#   3. mcp-proxy, mcp-filesystem, mcp (crates) +
#      sdk-py (PyPI) + sdk-js (npm)               — need sdk-rs
#   4. api (crates)                — needs mcp-proxy
#      cli (crates)                — needs mcp (NOT api: the cli stopped
#                                    embedding the api server)
#      cocoindex (PyPI)            — needs sdk-py
#
# (The old 6-wave order published mcp AFTER cli — true back when
# objectiveai-mcp-cli depended on the cli. The SDK-only mcp refactor
# flipped that dependency, so cli's cargo-publish dep resolution failed
# every release until mcp moved ahead of it.)
#
# Each per-package publish workflow is called as a reusable workflow
# (`uses: ./.github/workflows/publish-objectiveai-X.yml`) so its
# secrets/setup/build steps stay defined in one place and remain
# triggerable manually via workflow_dispatch.
#
# Between waves a `wait-after-wave-N` job polls each registry until
# the just-published packages appear, so downstream waves don't race
# the index.
#
# Binaries (release.yml) auto-fire from the same push independently;
# they are not coupled here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # for the sdk-go tag push
  id-token: write  # for npm Trusted Publishing on the publish-sdk-js call

concurrency:
  group: auto-publish-libraries
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Read version + probe crates.io
        run: |
          VERSION=$(awk '/^version = "/ { gsub(/version = "|"/, ""); print; exit }' objectiveai-sdk-rs/Cargo.toml)
          echo "Canonical version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS -A "objectiveai-publish-orchestrator (admin@objectiveai.dev)" -o /dev/null "https://crates.io/api/v1/crates/objectiveai-sdk/$VERSION" 2>/dev/null; then
            echo "objectiveai-sdk@$VERSION is already live on crates.io — skip"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "objectiveai-sdk@$VERSION is not yet on crates.io — will publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Wave 1 ───────────────────────────────────────────────────────
  publish-sdk-rs-macros:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    uses: ./.github/workflows/publish-objectiveai-sdk-rs-macros.yml
    secrets: inherit

  publish-sdk-go:
    # The Go SDK versions independently via objectiveai-sdk-go/version.txt
    # — NOT the canonical lockstep version. This job runs on every push
    # (no should-publish gate): the tag-exists guard makes it a no-op
    # until version.txt is bumped, and a Rust-only lockstep bump no
    # longer drags a Go release along.
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push tag objectiveai-sdk-go/v<version.txt>
        run: |
          VERSION="$(tr -d ' \r\n' < objectiveai-sdk-go/version.txt)"
          if [ -z "$VERSION" ]; then
            echo "objectiveai-sdk-go/version.txt is missing or empty" >&2
            exit 1
          fi
          TAG="objectiveai-sdk-go/v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on origin — skip"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "objectiveai-sdk-go v$VERSION"
          git push origin "$TAG"

  # ─── Wave 2 ───────────────────────────────────────────────────────
  wait-after-wave-1:
    needs: [check-version, publish-sdk-rs-macros, publish-sdk-go]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for sdk-macros on crates.io sparse index
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        # Probe https://index.crates.io/<sparse-path>/<name> (what cargo
        # actually reads when resolving `cargo publish` deps) rather than
        # api/v1/crates — the latter returns 200 well before the sparse
        # index has the new version, and downstream cargo-publish jobs
        # then fail with "failed to select a version for the requirement".
        run: |
          NAME=objectiveai-sdk-macros
          SPARSE_PATH="${NAME:0:2}/${NAME:2:2}/$NAME"
          for _ in $(seq 1 120); do
            if curl -fsS "https://index.crates.io/$SPARSE_PATH" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
              echo "$NAME@$VERSION live in sparse index"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for $NAME@$VERSION in sparse index"; exit 1

  publish-sdk-rs:
    needs: wait-after-wave-1
    uses: ./.github/workflows/publish-objectiveai-sdk-rs.yml
    secrets: inherit

  # ─── Wave 3 ───────────────────────────────────────────────────────
  wait-after-wave-2:
    needs: [check-version, publish-sdk-rs]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for sdk on crates.io sparse index
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          NAME=objectiveai-sdk
          SPARSE_PATH="${NAME:0:2}/${NAME:2:2}/$NAME"
          for _ in $(seq 1 120); do
            if curl -fsS "https://index.crates.io/$SPARSE_PATH" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
              echo "$NAME@$VERSION live in sparse index"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for $NAME@$VERSION in sparse index"; exit 1

  publish-mcp-proxy:
    needs: wait-after-wave-2
    uses: ./.github/workflows/publish-objectiveai-mcp-proxy.yml
    secrets: inherit

  publish-mcp-filesystem:
    needs: wait-after-wave-2
    uses: ./.github/workflows/publish-objectiveai-mcp-filesystem.yml
    secrets: inherit

  publish-sdk-py:
    needs: wait-after-wave-2
    uses: ./.github/workflows/publish-objectiveai-sdk-py.yml
    secrets: inherit

  publish-sdk-js:
    needs: wait-after-wave-2
    uses: ./.github/workflows/publish-objectiveai-sdk-js.yml
    secrets: inherit

  publish-mcp:
    needs: wait-after-wave-2
    uses: ./.github/workflows/publish-objectiveai-mcp.yml
    secrets: inherit

  # ─── Wave 4 ───────────────────────────────────────────────────────
  wait-after-wave-3:
    needs: [check-version, publish-mcp-proxy, publish-mcp-filesystem, publish-mcp, publish-sdk-py, publish-sdk-js]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for mcp-proxy + mcp on crates.io sparse index, sdk on PyPI
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        # mcp-proxy gates publish-api, mcp gates publish-cli, and
        # objectiveai-sdk on PyPI gates publish-cocoindex — all three
        # wave-4 jobs key off this single barrier.
        run: |
          for NAME in objectiveai-mcp-proxy objectiveai-mcp; do
            SPARSE_PATH="${NAME:0:2}/${NAME:2:2}/$NAME"
            ok=false
            for _ in $(seq 1 120); do
              if curl -fsS "https://index.crates.io/$SPARSE_PATH" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
                echo "$NAME@$VERSION live in sparse index"
                ok=true
                break
              fi
              sleep 5
            done
            $ok || { echo "timed out waiting for $NAME@$VERSION in sparse index"; exit 1; }
          done
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/objectiveai-sdk/$VERSION/json" 2>/dev/null; then
              echo "objectiveai-sdk@$VERSION live on PyPI"
              exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for objectiveai-sdk@$VERSION on PyPI"; exit 1

  publish-api:
    needs: wait-after-wave-3
    uses: ./.github/workflows/publish-objectiveai-api.yml
    secrets: inherit

  publish-cli:
    needs: wait-after-wave-3
    uses: ./.github/workflows/publish-objectiveai-cli.yml
    secrets: inherit

  publish-cocoindex:
    needs: wait-after-wave-3
    uses: ./.github/workflows/publish-objectiveai-cocoindex.yml
    secrets: inherit
