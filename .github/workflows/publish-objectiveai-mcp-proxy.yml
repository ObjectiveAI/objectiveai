name: Publish objectiveai-mcp-proxy

# Publishes the `objectiveai-mcp-proxy` crate to crates.io. Triggered manually
# via workflow_dispatch.
#
# Setup required (one-time):
#   - CARGO_REGISTRY_TOKEN: crates.io API token with `publish-update` scope.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish -p objectiveai-mcp-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --no-verify: skip the local compile check so cargo doesn't try
        # to resolve the dev-only `test-upstream` path dep on crates.io.
        # The workspace was already type-checked before publish.
        run: cargo publish --no-verify -p objectiveai-mcp-proxy
