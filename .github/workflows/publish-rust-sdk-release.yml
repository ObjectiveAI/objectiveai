name: Publish Rust SDK (release-triggered)

# Out-of-band release of the Rust SDK ONLY — `objectiveai-sdk-macros`
# then `objectiveai-sdk` — without touching any other package.
#
# Trigger: publish a GitHub release whose tag is `rust-sdk-v<version>`
# (e.g. `rust-sdk-v2.0.12`). The version is taken FROM THE TAG and
# injected into the two Cargo.tomls in the runner only — nothing is
# committed, so the repo's lockstep version stays as-is and
# auto-publish-libraries.yml (which keys on the committed
# objectiveai-sdk-rs version) never fires a full rollout.
#
# Macros publishes first because the sdk's source uses its attribute
# macros (`#[json_schema_ignore]`, `#[schema_override]`) and depends
# on it by version.
#
# NOTE for the next lockstep release: pick a version ABOVE any
# out-of-band rust-sdk release published here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish objectiveai-sdk-macros + objectiveai-sdk
    if: startsWith(github.event.release.tag_name, 'rust-sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Inject version from release tag (runner-only, not committed)
        run: |
          VERSION="${TAG#rust-sdk-v}"
          echo "Publishing version $VERSION (from tag $TAG)"
          # Package versions: first `version = "…"` line is [package].
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" \
            objectiveai-sdk-rs-macros/Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" \
            objectiveai-sdk-rs/Cargo.toml
          # The sdk's macros dep must require the version published in
          # the same run (older published macros lack the newer
          # attribute macros).
          sed -i "s/objectiveai-sdk-macros = { version = \"[^\"]*\"/objectiveai-sdk-macros = { version = \"$VERSION\"/" \
            objectiveai-sdk-rs/Cargo.toml
          grep '^version' objectiveai-sdk-rs-macros/Cargo.toml objectiveai-sdk-rs/Cargo.toml
          grep 'objectiveai-sdk-macros = {' objectiveai-sdk-rs/Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: cargo publish -p objectiveai-sdk-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version injection above edits Cargo.toml
        # in the working tree.
        run: cargo publish --allow-dirty -p objectiveai-sdk-macros

      - name: Wait for crates.io to index objectiveai-sdk-macros
        run: |
          VERSION="${TAG#rust-sdk-v}"
          for i in $(seq 1 60); do
            if curl -fsSL "https://crates.io/api/v1/crates/objectiveai-sdk-macros/$VERSION" > /dev/null 2>&1; then
              echo "indexed after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "objectiveai-sdk-macros@$VERSION not indexed after 10m" >&2
          exit 1
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Stage JSON schemas into the crate
        # Same staging publish-objectiveai-sdk-rs.yml does: build.rs
        # needs the schemas at build time; the sibling
        # objectiveai-json-schema directory is not part of the
        # published tarball, so copy them into objectiveai-sdk-rs/schemas/
        # where build.rs finds them as a packaged fallback and the
        # Cargo `include` field bundles them.
        run: |
          mkdir -p objectiveai-sdk-rs/schemas
          cp objectiveai-json-schema/*.json objectiveai-sdk-rs/schemas/

      - name: cargo publish -p objectiveai-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty -p objectiveai-sdk
