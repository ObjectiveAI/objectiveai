name: Publish objectiveai-cocoindex

# Builds and uploads the pure-Python `objectiveai-cocoindex` distribution to
# PyPI (or TestPyPI). Triggered manually via workflow_dispatch.
#
# Pure-Python (hatchling backend, no native extension), so a single
# `py3-none-any` wheel + sdist covers every platform.
#
# Setup required (one-time):
#   - PYPI_API_TOKEN: API token from https://pypi.org/manage/account/token/
#     (project scope: objectiveai-cocoindex). Save as repo secret.
#   - (Optional) TEST_PYPI_API_TOKEN for the testpypi target.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi
  workflow_call:
    inputs:
      target:
        description: 'Where to publish'
        required: false
        default: 'pypi'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Stage README + LICENSE for objectiveai-cocoindex
        # objectiveai-cocoindex/.gitignore excludes /README.md and
        # /LICENSE -- they're staged from the repo root at publish
        # time so a single source-of-truth README + LICENSE applies
        # across all packages.
        run: |
          cp README.md objectiveai-cocoindex/README.md
          cp LICENSE objectiveai-cocoindex/LICENSE

      - name: Build sdist + wheel
        working-directory: objectiveai-cocoindex
        run: python -m build --sdist --wheel --outdir dist

      - name: List artifacts
        run: ls -la objectiveai-cocoindex/dist/

      - name: twine check
        run: python -m twine check objectiveai-cocoindex/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: cocoindex-dist
          path: objectiveai-cocoindex/dist/*
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cocoindex-dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
