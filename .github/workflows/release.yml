name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Per-leg flat structure:
#
# check-version
# ├─→ create-release
# │
# ├─→ cli-<leg>                            (× 5 cli legs)
# ├─→ mcp-fs-api-<leg> ──→ api-<leg>       (× 5 api legs)
# ├─→ mcp-fs-viewer-<leg> ──→ viewer-<leg> (× 5 viewer legs)
# └─→ mcp-<leg>                            (× 5 mcp legs)
#
# The cli no longer embeds the viewer binary or the api server. Since
# objectiveai-mcp-cli depends on the cli (not on api), the mcp legs
# also no longer need a paired mcp-filesystem artifact. Only the api
# and viewer legs (which DO embed mcp-filesystem for their own use)
# keep their dedicated `mcp-fs-<leg>` upstreams. 10 mcp-fs jobs total
# (5 api + 5 viewer).
#
# All 20 leg jobs (5 cli + 5 api + 5 viewer + 5 mcp) append their
# assets to the same `v<version>` GitHub Release as they finish.

jobs:
  check-version:
    name: Check CLI version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from objectiveai-cli/Cargo.toml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path objectiveai-cli/Cargo.toml | jq -r '.packages[] | select(.name == "objectiveai-cli") | .version')
          echo "CLI version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will build"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create release
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        # Write notes to a file rather than capturing into a step output —
        # commit messages routinely contain backticks (`like this`) and
        # other shell metacharacters, which GHA's `${{ }}` interpolator
        # would inline literally into the next step's bash script and
        # cause bash to try evaluating them as command substitutions.
        # `--notes-file` reads the bytes directly with zero shell
        # interpolation involved.
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD > release-notes.md
          else
            echo "No previous tags — using full history"
            git log --pretty=format:"- %s" > release-notes.md
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — leaving as-is."
            exit 0
          fi
          # Created without --draft so per-asset uploads are user-visible
          # the moment each cli-<leg> job finishes uploading. CLI legs
          # append assets in parallel via `gh release upload --clobber`.
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  # ── CLI builders (5 dedicated jobs) ───────────────────────────────────────
  # The cli no longer embeds the viewer or the api server, so each cli
  # leg just runs `cargo build` on its own — no paired mcp-fs upstream
  # needed.

  cli-linux-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-linux-x86_64
          src_name: objectiveai
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  cli-linux-aarch64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-linux-aarch64
          src_name: objectiveai
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  cli-macos-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-macos-x86_64
          src_name: objectiveai
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  cli-macos-aarch64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-macos-aarch64
          src_name: objectiveai
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  cli-windows-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-windows-x86_64.exe
          src_name: objectiveai.exe
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  # ── mcp-filesystem builders for API legs (5 dedicated jobs) ───────────────

  mcp-fs-api-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-api-linux-x86_64

  mcp-fs-api-linux-aarch64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: aarch64-unknown-linux-musl
          artifact-name: mcp-filesystem-api-linux-aarch64

  mcp-fs-api-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-api-macos-x86_64

  mcp-fs-api-macos-aarch64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: aarch64-unknown-linux-musl
          artifact-name: mcp-filesystem-api-macos-aarch64

  mcp-fs-api-windows-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-api-windows-x86_64

  # ── mcp-filesystem builders for Viewer legs (5 dedicated jobs) ────────────

  mcp-fs-viewer-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-viewer-linux-x86_64

  mcp-fs-viewer-linux-aarch64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: aarch64-unknown-linux-musl
          artifact-name: mcp-filesystem-viewer-linux-aarch64

  mcp-fs-viewer-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-viewer-macos-x86_64

  mcp-fs-viewer-macos-aarch64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: aarch64-unknown-linux-musl
          artifact-name: mcp-filesystem-viewer-macos-aarch64

  mcp-fs-viewer-windows-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-filesystem
        with:
          target: x86_64-unknown-linux-musl
          artifact-name: mcp-filesystem-viewer-windows-x86_64

  # ── API builders (5 dedicated jobs, each pinned to its mcp-fs upstream) ───

  api-linux-x86_64:
    needs: [check-version, create-release, mcp-fs-api-linux-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-api-linux-x86_64
          asset: objectiveai-linux-x86_64-api
          src_name: objectiveai-api
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  api-linux-aarch64:
    needs: [check-version, create-release, mcp-fs-api-linux-aarch64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          mcp_target: aarch64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-api-linux-aarch64
          asset: objectiveai-linux-aarch64-api
          src_name: objectiveai-api
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  api-macos-x86_64:
    needs: [check-version, create-release, mcp-fs-api-macos-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-api-macos-x86_64
          asset: objectiveai-macos-x86_64-api
          src_name: objectiveai-api
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  api-macos-aarch64:
    needs: [check-version, create-release, mcp-fs-api-macos-aarch64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          mcp_target: aarch64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-api-macos-aarch64
          asset: objectiveai-macos-aarch64-api
          src_name: objectiveai-api
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  api-windows-x86_64:
    needs: [check-version, create-release, mcp-fs-api-windows-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-api-windows-x86_64
          asset: objectiveai-windows-x86_64-api.exe
          src_name: objectiveai-api.exe
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  # ── Viewer builders (5 dedicated jobs, each pinned to its mcp-fs upstream) ─

  viewer-linux-x86_64:
    needs: [check-version, create-release, mcp-fs-viewer-linux-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-viewer-linux-x86_64
          asset: objectiveai-linux-x86_64-viewer
          src_name: objectiveai-viewer
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  viewer-linux-aarch64:
    needs: [check-version, create-release, mcp-fs-viewer-linux-aarch64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          mcp_target: aarch64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-viewer-linux-aarch64
          asset: objectiveai-linux-aarch64-viewer
          src_name: objectiveai-viewer
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  viewer-macos-x86_64:
    needs: [check-version, create-release, mcp-fs-viewer-macos-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-viewer-macos-x86_64
          asset: objectiveai-macos-x86_64-viewer
          src_name: objectiveai-viewer
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  viewer-macos-aarch64:
    needs: [check-version, create-release, mcp-fs-viewer-macos-aarch64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          mcp_target: aarch64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-viewer-macos-aarch64
          asset: objectiveai-macos-aarch64-viewer
          src_name: objectiveai-viewer
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  viewer-windows-x86_64:
    needs: [check-version, create-release, mcp-fs-viewer-windows-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          mcp_target: x86_64-unknown-linux-musl
          mcp_artifact_name: mcp-filesystem-viewer-windows-x86_64
          asset: objectiveai-windows-x86_64-viewer.exe
          src_name: objectiveai-viewer.exe
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  # ── MCP builders (5 dedicated jobs) ───────────────────────────────────────
  # objectiveai-mcp-cli no longer transitively pulls in objectiveai-api
  # (because the cli no longer does either), so the mcp legs don't need
  # a paired mcp-filesystem artifact either.

  mcp-linux-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-linux-x86_64-mcp
          src_name: objectiveai-mcp
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  mcp-linux-aarch64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-linux-aarch64-mcp
          src_name: objectiveai-mcp
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  mcp-macos-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-macos-x86_64-mcp
          src_name: objectiveai-mcp
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  mcp-macos-aarch64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-macos-aarch64-mcp
          src_name: objectiveai-mcp
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}

  mcp-windows-x86_64:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-windows-x86_64-mcp.exe
          src_name: objectiveai-mcp.exe
          version: ${{ needs.check-version.outputs.version }}
          repository: ${{ github.repository }}
