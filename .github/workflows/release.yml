name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# ── Structure ─────────────────────────────────────────────────────────────
#
# check-version ─→ create-release
#
# cli / api / viewer / mcp / db / runner  (each a matrix over the 6 platforms)
#   Each leg builds ONE binary for ONE platform on its own runner and uploads
#   it as a workflow artifact named objectiveai-<os>-<arch>[-<pkg>][.exe].
#   Legs no longer append to the release directly — the release is six zips.
#
# package (matrix: 6 platforms) ─→ six release assets
#   Each entry downloads its platform's 7 artifacts (cli, api, viewer, mcp,
#   db, claude-runner, codex-runner), renames them to their runtime bin names,
#   zips them at the archive root, and uploads objectiveai-<os>-<arch>.zip.
#
# Six platforms = {linux, macos, windows} × {x86_64, aarch64}.
#
# NOTE — windows-aarch64 is new. It runs on the `windows-11-arm` runner, whose
# toolchain support for the Tauri viewer, the PyInstaller sdk-runners, and
# objectiveai-db's bundled postgres is not yet proven. `package` runs with
# `if: always()` + `fail-fast: false`, so if any windows-aarch64 leg fails its
# zip is simply skipped — the other five zips still publish.

jobs:
  check-version:
    name: Check CLI version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from objectiveai-cli/Cargo.toml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path objectiveai-cli/Cargo.toml | jq -r '.packages[] | select(.name == "objectiveai-cli") | .version')
          echo "CLI version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will build"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create release
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        # Write notes to a file rather than capturing into a step output —
        # commit messages routinely contain backticks (`like this`) and
        # other shell metacharacters, which GHA's `${{ }}` interpolator
        # would inline literally into the next step's bash script and
        # cause bash to try evaluating them as command substitutions.
        # `--notes-file` reads the bytes directly with zero shell
        # interpolation involved.
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD > release-notes.md
          else
            echo "No previous tags — using full history"
            git log --pretty=format:"- %s" > release-notes.md
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — leaving as-is."
            exit 0
          fi
          # Created up front (not --draft) so the six per-platform zips
          # become visible as each `package` job finishes uploading.
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  # ── CLI ───────────────────────────────────────────────────────────────────

  cli:
    name: cli (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cli-leg
        with:
          asset: objectiveai-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          src_name: objectiveai${{ matrix.ext }}

  # ── API ────────────────────────────────────────────────────────────────────

  api:
    name: api (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-api-leg
        with:
          asset: objectiveai-${{ matrix.os }}-${{ matrix.arch }}-api${{ matrix.ext }}
          src_name: objectiveai-api${{ matrix.ext }}

  # ── Viewer ─────────────────────────────────────────────────────────────────

  viewer:
    name: viewer (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-viewer-leg
        with:
          asset: objectiveai-${{ matrix.os }}-${{ matrix.arch }}-viewer${{ matrix.ext }}
          src_name: objectiveai-viewer${{ matrix.ext }}

  # ── MCP ────────────────────────────────────────────────────────────────────

  mcp:
    name: mcp (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mcp-leg
        with:
          asset: objectiveai-${{ matrix.os }}-${{ matrix.arch }}-mcp${{ matrix.ext }}
          src_name: objectiveai-mcp${{ matrix.ext }}

  # ── DB (bundles its own postgres; needs GITHUB_TOKEN for the archive) ──────

  db:
    name: db (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-db-leg
        with:
          asset: objectiveai-${{ matrix.os }}-${{ matrix.arch }}-db${{ matrix.ext }}
          src_name: objectiveai-db${{ matrix.ext }}

  # ── SDK runners (PyInstaller; spawned by the api from bin/ at runtime) ─────

  runner:
    name: runner ${{ matrix.runner.label }} (${{ matrix.platform.os }}-${{ matrix.platform.arch }})
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux,   arch: x86_64,  runs-on: ubuntu-22.04,     ext: "" }
          - { os: linux,   arch: aarch64, runs-on: ubuntu-24.04-arm, ext: "" }
          - { os: macos,   arch: x86_64,  runs-on: macos-15-intel,   ext: "" }
          - { os: macos,   arch: aarch64, runs-on: macos-14,         ext: "" }
          - { os: windows, arch: x86_64,  runs-on: windows-latest,   ext: ".exe" }
          - { os: windows, arch: aarch64, runs-on: windows-11-arm,   ext: ".exe" }
        runner:
          - { crate: objectiveai-claude-agent-sdk-runner, label: claude-runner }
          - { crate: objectiveai-codex-sdk-runner,        label: codex-runner }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-runner-leg
        with:
          runner: ${{ matrix.runner.crate }}
          asset: objectiveai-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.runner.label }}${{ matrix.platform.ext }}

  # ── Package: six per-platform zips ─────────────────────────────────────────
  # `if: always()` (plus fail-fast: false) so a failed leg on ONE platform
  # doesn't skip packaging for the others — each entry pulls only its own
  # platform's artifacts; a missing one fails just that entry.

  package:
    name: package (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, cli, api, viewer, mcp, db, runner]
    if: always() && needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  ext: "" }
          - { os: linux,   arch: aarch64, ext: "" }
          - { os: macos,   arch: x86_64,  ext: "" }
          - { os: macos,   arch: aarch64, ext: "" }
          - { os: windows, arch: x86_64,  ext: ".exe" }
          - { os: windows, arch: aarch64, ext: ".exe" }
    steps:
      - name: Download this platform's binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: objectiveai-${{ matrix.os }}-${{ matrix.arch }}*
      - name: Assemble bin/ layout and zip
        run: |
          set -euo pipefail
          P="objectiveai-${{ matrix.os }}-${{ matrix.arch }}"
          E="${{ matrix.ext }}"
          # download-artifact lands each artifact at artifacts/<name>/<name>.
          pick() { echo "artifacts/$1/$1"; }
          mkdir -p stage
          cp "$(pick "$P$E")"                "stage/objectiveai$E"
          cp "$(pick "$P-api$E")"            "stage/objectiveai-api$E"
          cp "$(pick "$P-viewer$E")"         "stage/objectiveai-viewer$E"
          cp "$(pick "$P-mcp$E")"            "stage/objectiveai-mcp$E"
          cp "$(pick "$P-db$E")"             "stage/objectiveai-db$E"
          cp "$(pick "$P-claude-runner$E")"  "stage/objectiveai-claude-agent-sdk-runner$E"
          cp "$(pick "$P-codex-runner$E")"   "stage/objectiveai-codex-sdk-runner$E"
          (cd stage && zip -r "../$P.zip" .)
          echo "Built $P.zip:"
          unzip -l "$P.zip"
      - name: Upload zip to release
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          P="objectiveai-${{ matrix.os }}-${{ matrix.arch }}"
          gh release upload "v$VERSION" "$P.zip" \
            --clobber \
            --repo "${{ github.repository }}"
