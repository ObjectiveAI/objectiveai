name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check CLI version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from objectiveai-cli/Cargo.toml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path objectiveai-cli/Cargo.toml | jq -r '.packages[] | select(.name == "objectiveai-cli") | .version')
          echo "CLI version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will build"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  build-mcp-filesystem:
    name: Build objectiveai-mcp-filesystem (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build mcp-filesystem
        run: |
          cross build -p objectiveai-mcp-filesystem --target ${{ matrix.target }} --release
      - name: Stage embed directory with fingerprint
        run: |
          EMBED_DIR="objectiveai-mcp-filesystem/embed/${{ matrix.target }}/release"
          mkdir -p "$EMBED_DIR"
          cp "target/${{ matrix.target }}/release/objectiveai-mcp-filesystem" "$EMBED_DIR/"
          # Compute the same fingerprint that build.sh would write, so the
          # downstream install.sh invocation on the CLI build jobs skips the
          # mcp-filesystem rebuild step (fingerprint match → no-op).
          source objectiveai-mcp-filesystem/fingerprint.sh --target ${{ matrix.target }} --release
          echo "$CURRENT_FP" > "$EMBED_DIR/.fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-filesystem-${{ matrix.target }}
          path: objectiveai-mcp-filesystem/embed/${{ matrix.target }}/release/
          if-no-files-found: error
          # `.fingerprint` is a hidden dotfile and is required for the
          # downstream build-cli jobs to short-circuit the rebuild step.
          include-hidden-files: true

  build-cli:
    name: Build CLI (${{ matrix.asset }})
    needs: [check-version, build-mcp-filesystem]
    if: needs.check-version.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # With viewer (default)
          - os: ubuntu-22.04
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-linux-x86_64
            src_name: objectiveai
            install_args: ""
            viewer: true
          - os: ubuntu-24.04-arm
            mcp_target: aarch64-unknown-linux-musl
            asset: objectiveai-linux-aarch64
            src_name: objectiveai
            install_args: ""
            viewer: true
          - os: macos-13
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-macos-x86_64
            src_name: objectiveai
            install_args: ""
            viewer: true
          - os: macos-14
            mcp_target: aarch64-unknown-linux-musl
            asset: objectiveai-macos-aarch64
            src_name: objectiveai
            install_args: ""
            viewer: true
          - os: windows-latest
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-windows-x86_64.exe
            src_name: objectiveai.exe
            install_args: ""
            viewer: true
          # Without viewer
          - os: ubuntu-22.04
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-linux-x86_64-no-viewer
            src_name: objectiveai
            install_args: "--no-viewer"
            viewer: false
          - os: ubuntu-24.04-arm
            mcp_target: aarch64-unknown-linux-musl
            asset: objectiveai-linux-aarch64-no-viewer
            src_name: objectiveai
            install_args: "--no-viewer"
            viewer: false
          - os: macos-13
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-macos-x86_64-no-viewer
            src_name: objectiveai
            install_args: "--no-viewer"
            viewer: false
          - os: macos-14
            mcp_target: aarch64-unknown-linux-musl
            asset: objectiveai-macos-aarch64-no-viewer
            src_name: objectiveai
            install_args: "--no-viewer"
            viewer: false
          - os: windows-latest
            mcp_target: x86_64-unknown-linux-musl
            asset: objectiveai-windows-x86_64-no-viewer.exe
            src_name: objectiveai.exe
            install_args: "--no-viewer"
            viewer: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          # Match `packageManager` in the root package.json so workspace
          # resolution stays consistent with local installs.
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          # Pin Python to avoid macOS runners flipping the default to a
          # version PyInstaller doesn't yet support, and to keep the
          # sdk-runner-py fingerprint stable across runner OS versions.
          python-version: '3.13'
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux' && matrix.viewer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      - name: Download pre-built objectiveai-mcp-filesystem
        uses: actions/download-artifact@v4
        with:
          name: mcp-filesystem-${{ matrix.mcp_target }}
          path: objectiveai-mcp-filesystem/embed/${{ matrix.mcp_target }}/release/
      - name: Build CLI
        shell: bash
        run: bash objectiveai-cli/install.sh ${{ matrix.install_args }}
      - name: Dump build logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in .logs/build/*.txt; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Stage release binary
        shell: bash
        run: cp "$HOME/.objectiveai/${{ matrix.src_name }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [check-version, build-cli]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: objectiveai-*
          merge-multiple: true
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            echo "No previous tags — using full history"
            NOTES=$(git log --pretty=format:"- %s")
          fi
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ls -la artifacts/
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --draft \
            --title "v$VERSION" \
            --notes "${{ steps.notes.outputs.notes }}" \
            artifacts/*
