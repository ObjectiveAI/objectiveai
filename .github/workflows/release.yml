name: Release

# One CLI-version-gated release for everything. The version in
# objectiveai-cli/Cargo.toml is the core trigger: on a push to main where
# the GitHub Release `v<version>` does not yet exist, this workflow rolls
# out (all-or-nothing, keyed off that one version):
#
#   • the five per-platform binary zips (objectiveai-<version>-<os>-<arch>.zip), each
#     produced by `bash build.sh --release --no-sdk --no-test-integration`
#     and uploaded to the release; and
#   • the language SDKs: rust (crates.io) → python (PyPI) → javascript (npm)
#     run sequentially so each resolves before the next; golang (git tag)
#     runs independently (it ships committed artifacts and pulls from no
#     registry, so nothing gates on it and it gates on nothing but the version).
#
# The SDK jobs DO NOT run code generation or build wasm — they ship the
# artifacts already committed to the repo (committed dist/ for js, committed
# lib wasm + types for go, committed pydantic types for py; rust is a plain
# cargo publish). Whoever bumps the version is responsible for committing
# fresh generated artifacts first (via build.sh).
#
# Re-runs: the GitHub-release-exists gate makes a new version publish once.
# To resume after a partial failure WITHOUT deleting the release, dispatch
# this workflow manually with `force=true` (Actions UI or
# `gh workflow run release.yml --ref main -f force=true`). The per-package
# "skip if already published" guards make completed publishes no-ops, so only
# the previously-failed pieces are produced. (Deleting the release and
# re-running also works, but force avoids the delete.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-run even if v<version> already exists (idempotent guards skip what is already published)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release, upload zips, push the go tag
  id-token: write   # npm Trusted Publishing (OIDC) for the js publish

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check CLI version
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from objectiveai-cli/Cargo.toml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path objectiveai-cli/Cargo.toml | jq -r '.packages[] | select(.name == "objectiveai-cli") | .version')
          echo "CLI version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true — releasing even though v$VERSION may exist (idempotent guards skip published artifacts)"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist — will release"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create release
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "$PREV_TAG"..HEAD > release-notes.md
          else
            git log --pretty=format:"- %s" > release-notes.md
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — leaving as-is."
            exit 0
          fi
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  # ── objectiveai-mcp-laboratory: the two musl-linux binaries ───────────────
  # This binary is injected into Docker laboratory containers, so it is ALWAYS
  # a musl-linux build, arch-matched to the host. It ships in every platform
  # zip (incl. macOS/Windows) under the fixed name `objectiveai-mcp-laboratory`
  # (no .exe). To avoid cross-compiling musl from the mac/windows runners, the
  # two arches are built here where musl is native (linux) and uploaded as
  # artifacts; each `binaries-<arch>` job downloads its arch's artifact.
  #
  # Split per-arch (not one matrix) so each zip job depends ONLY on its own
  # arch's laboratory build: an aarch64 runner shortage can't gate the x86_64
  # zips, and vice-versa. GitHub `needs` is job-level, so per-arch decoupling
  # requires per-arch jobs.

  laboratory-x86_64:
    name: laboratory musl (x86_64)
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-unknown-linux-musl
      # Pure-Rust crate (no ring/openssl/aws-lc/rustls in its dep closure), so
      # rustup's self-contained musl std suffices — no musl-tools / cmake.
      - name: Build musl binary
        shell: bash
        run: bash objectiveai-mcp-laboratory/build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: laboratory-x86_64
          path: objectiveai-mcp-laboratory/embed/x86_64-unknown-linux-musl/release/objectiveai-mcp-laboratory
          if-no-files-found: error

  laboratory-aarch64:
    name: laboratory musl (aarch64)
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-unknown-linux-musl
      - name: Build musl binary
        shell: bash
        run: bash objectiveai-mcp-laboratory/build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: laboratory-aarch64
          path: objectiveai-mcp-laboratory/embed/aarch64-unknown-linux-musl/release/objectiveai-mcp-laboratory
          if-no-files-found: error

  # ── Binary zips (5 platforms; build.sh --release --no-sdk --no-test-integration) ──
  # Split into binaries-x86_64 (linux/macos/windows) and binaries-aarch64
  # (linux/macos) so each depends only on its arch's laboratory job. The steps
  # are identical between the two — they read matrix.arch / matrix.triple — only
  # the matrix platform list and the laboratory `needs` differ.
  #
  # No windows-arm64: objectiveai-db's bundled embedded-postgres has no
  # aarch64-pc-windows-msvc binary upstream (theseus-rs/postgresql-binaries),
  # so the zip can't be built (or would ship a non-functional db).

  binaries-x86_64:
    name: zip (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release, laboratory-x86_64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64, runs-on: ubuntu-22.04,   triple: x86_64-unknown-linux-musl }
          - { os: macos,   arch: x86_64, runs-on: macos-15-intel, triple: x86_64-unknown-linux-musl }
          - { os: windows, arch: x86_64, runs-on: windows-latest, triple: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download laboratory musl binary
        uses: actions/download-artifact@v4
        with:
          name: laboratory-${{ matrix.arch }}
          path: lab-dl
      - name: Place laboratory binary into embed/
        shell: bash
        # Pre-place the prebuilt musl binary where build.sh packaging expects
        # it; build.sh then sees it present and does not rebuild (no musl
        # compile attempted on mac/windows). `test -f` is the CI integrity
        # guard guaranteeing the zip includes it.
        run: |
          dest="objectiveai-mcp-laboratory/embed/${{ matrix.triple }}/release"
          mkdir -p "$dest"
          cp "lab-dl/objectiveai-mcp-laboratory" "$dest/objectiveai-mcp-laboratory"
          chmod +x "$dest/objectiveai-mcp-laboratory"
          test -f "$dest/objectiveai-mcp-laboratory"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # node + pnpm: the viewer's build.sh runs `pnpm install` + `tauri build`
      # (frontend against the committed workspace SDK — no SDK build).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      - name: Build + package the zip
        shell: bash
        # --no-sdk: only phase 1 (the 5 cli/server crates, the Tauri viewer
        # via `tauri build`, and the 2 PyInstaller runners) + packaging run;
        # no SDK toolchain. --no-test-integration: skip the plugin/tool
        # integration-test fixture crates — they're test inputs, never
        # shipped in the release zip. GITHUB_TOKEN lets objectiveai-db's
        # postgres archive download avoid rate limits.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build.sh --release --no-sdk --no-test-integration
      - name: Dump build logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in .logs/build/*.txt; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
      - name: Upload zip to release
        shell: bash
        run: |
          gh release upload "v${{ needs.check-version.outputs.version }}" \
            "$HOME"/.objectiveai/bin/objectiveai-*.zip \
            --clobber --repo "${{ github.repository }}"

  binaries-aarch64:
    name: zip (${{ matrix.os }}-${{ matrix.arch }})
    needs: [check-version, create-release, laboratory-aarch64]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.runs-on }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: aarch64, runs-on: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
          - { os: macos, arch: aarch64, runs-on: macos-14,         triple: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download laboratory musl binary
        uses: actions/download-artifact@v4
        with:
          name: laboratory-${{ matrix.arch }}
          path: lab-dl
      - name: Place laboratory binary into embed/
        shell: bash
        # Pre-place the prebuilt musl binary where build.sh packaging expects
        # it; build.sh then sees it present and does not rebuild (no musl
        # compile attempted on mac/windows). `test -f` is the CI integrity
        # guard guaranteeing the zip includes it.
        run: |
          dest="objectiveai-mcp-laboratory/embed/${{ matrix.triple }}/release"
          mkdir -p "$dest"
          cp "lab-dl/objectiveai-mcp-laboratory" "$dest/objectiveai-mcp-laboratory"
          chmod +x "$dest/objectiveai-mcp-laboratory"
          test -f "$dest/objectiveai-mcp-laboratory"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # node + pnpm: the viewer's build.sh runs `pnpm install` + `tauri build`
      # (frontend against the committed workspace SDK — no SDK build).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      - name: Build + package the zip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build.sh --release --no-sdk --no-test-integration
      - name: Dump build logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log in .logs/build/*.txt; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
      - name: Upload zip to release
        shell: bash
        run: |
          gh release upload "v${{ needs.check-version.outputs.version }}" \
            "$HOME"/.objectiveai/bin/objectiveai-*.zip \
            --clobber --repo "${{ github.repository }}"

  # ── SDK: rust → python → javascript → golang (sequential) ──────────────────
  # No codegen, no wasm build — ship what's committed.

  publish-rust:
    name: SDK · rust (crates.io)
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (dependency order, with sparse-index waits)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          # Skip a crate already live at $VERSION (makes a re-run resumable).
          publish_crate() {
            local name="$1"; shift
            local sparse="${name:0:2}/${name:2:2}/$name"
            if curl -fsS "https://index.crates.io/$sparse" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
              echo "$name@$VERSION already on crates.io — skip"
              return 0
            fi
            cargo publish -p "$name" "$@"
          }
          # Block until a just-published crate is in the sparse index cargo
          # reads when resolving the next crate's deps.
          wait_crate() {
            local name="$1"
            local sparse="${name:0:2}/${name:2:2}/$name"
            for _ in $(seq 1 120); do
              if curl -fsS "https://index.crates.io/$sparse" 2>/dev/null | grep -q "\"vers\":\"$VERSION\""; then
                echo "$name@$VERSION live in sparse index"; return 0
              fi
              sleep 5
            done
            echo "timed out waiting for $name@$VERSION in sparse index" >&2; exit 1
          }

          publish_crate objectiveai-sdk-macros
          wait_crate objectiveai-sdk-macros

          publish_crate objectiveai-sdk
          wait_crate objectiveai-sdk

          # --no-verify on api/cli/mcp-proxy: their build.rs / dev-only
          # path deps don't resolve from the published tarball alone.
          publish_crate objectiveai-mcp-proxy --no-verify
          publish_crate objectiveai-mcp-laboratory
          wait_crate objectiveai-mcp-proxy

          publish_crate objectiveai-api --no-verify
          publish_crate objectiveai-cli --no-verify

  # Python: build the sdk-py wheels/sdist (maturin compiles the pyo3
  # extension; no pydantic codegen — the committed types are used), then
  # publish sdk-py + the pure-python cocoindex to PyPI.
  py-wheels:
    name: SDK · python · wheel (${{ matrix.platform }})
    needs: [check-version, publish-rust]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-x86_64,  target: x86_64-unknown-linux-gnu,  manylinux: auto }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: macos-14,         platform: macos-arm64,    target: aarch64-apple-darwin }
          - { os: macos-15-intel,   platform: macos-x86_64,   target: x86_64-apple-darwin }
          - { os: windows-latest,   platform: windows-x86_64, target: x86_64-pc-windows-msvc }
          # win-arm64 wheel is fine (pyo3 is default-features=false: no
          # postgres/openssl/crypto) — unlike the binary zip, which can't be
          # built on win-arm64. Needs Python 3.13 (no CPython 3.10 on win-arm64).
          - { os: windows-11-arm,   platform: windows-arm64,  target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13 everywhere — the whole pipeline standardizes on one Python.
          python-version: '3.13'
      - name: Stage README + LICENSE
        shell: bash
        run: |
          cp README.md objectiveai-sdk-py/README.md
          cp LICENSE objectiveai-sdk-py/LICENSE
      - name: Build wheel (committed pydantic types — no codegen)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || '' }}
          sccache: 'true'
          working-directory: objectiveai-sdk-py
      - uses: actions/upload-artifact@v4
        with:
          name: py-wheel-${{ matrix.platform }}
          path: objectiveai-sdk-py/dist/*.whl
          if-no-files-found: error

  py-sdist:
    name: SDK · python · sdist
    needs: [check-version, publish-rust]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stage README + LICENSE
        run: |
          cp README.md objectiveai-sdk-py/README.md
          cp LICENSE objectiveai-sdk-py/LICENSE
      - name: Build sdist (no codegen)
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: objectiveai-sdk-py
      - uses: actions/upload-artifact@v4
        with:
          name: py-sdist
          path: objectiveai-sdk-py/dist/*.tar.gz
          if-no-files-found: error

  publish-python:
    name: SDK · python (PyPI)
    needs: [check-version, py-wheels, py-sdist]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download sdk-py artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'py-*'
          merge-multiple: true
      - name: Publish objectiveai-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Build + publish objectiveai-cocoindex (pure python)
        run: |
          cp README.md objectiveai-cocoindex/README.md
          cp LICENSE objectiveai-cocoindex/LICENSE
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir cocoindex-dist objectiveai-cocoindex
      - name: Publish cocoindex to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cocoindex-dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-javascript:
    name: SDK · javascript (npm)
    needs: [check-version, publish-python]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm to a Trusted-Publishing-aware version
        run: npm install -g npm@latest
      - name: Publish committed dist to npm (no build — ships committed wasm/zod)
        working-directory: objectiveai-sdk-js
        # The package's `files` is ["dist"] and dist/ is committed (wasm
        # baked in as base64); there are no prepublish build hooks, so this
        # ships exactly what's committed. OIDC Trusted Publishing — no token.
        run: |
          if npm view "@objectiveai/sdk@${{ needs.check-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "@objectiveai/sdk@${{ needs.check-version.outputs.version }} already on npm — skip"
            exit 0
          fi
          pnpm publish --access public --no-git-checks --provenance

  publish-golang:
    name: SDK · golang (git tag)
    # Independent of the rust→python→js chain: the Go SDK is just a git tag
    # over committed Go types + committed lib/objectiveai_cffi.wasm — it pulls
    # nothing from crates.io/PyPI/npm, so there's nothing to "resolve before"
    # it. Gating it behind the npm publish only let an unrelated npm failure
    # block the go tag for no reason.
    needs: [check-version]
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push tag objectiveai-sdk-go/v<version.txt>
        # The Go SDK versions independently via objectiveai-sdk-go/version.txt.
        # Ships committed Go types + committed lib/objectiveai_cffi.wasm — no
        # build. The tag-exists guard makes it a no-op until version.txt moves.
        run: |
          VERSION="$(tr -d ' \r\n' < objectiveai-sdk-go/version.txt)"
          if [ -z "$VERSION" ]; then
            echo "objectiveai-sdk-go/version.txt is missing or empty" >&2
            exit 1
          fi
          TAG="objectiveai-sdk-go/v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on origin — skip"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "objectiveai-sdk-go v$VERSION"
          git push origin "$TAG"
