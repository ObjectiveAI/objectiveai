name: Publish objectiveai-mcp

# Publishes the `objectiveai-mcp` crate to crates.io. Triggered manually
# via workflow_dispatch.
#
# Setup required (one-time):
#   - CARGO_REGISTRY_TOKEN: crates.io API token with `publish-update` scope.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish -p objectiveai-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --no-verify: objectiveai-mcp depends on objectiveai-cli + objectiveai-api,
        # whose build.rs scripts reach into sibling crates that are not
        # part of the published tarball. Verification compiles those
        # transitively and panics. Workspace is type-checked separately.
        run: cargo publish --no-verify -p objectiveai-mcp
