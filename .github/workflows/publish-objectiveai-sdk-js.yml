name: Publish objectiveai-sdk-js

# Builds and publishes the `@objectiveai/sdk` npm package. Triggered manually via
# workflow_dispatch.
#
# The build pipeline (`pnpm --filter @objectiveai/sdk run build`) regenerates Zod
# schemas from objectiveai-json-schema/, embeds the WASM loader, and bundles
# via tsup. We need to run a full repo build first because the JS package's
# build depends on objectiveai-sdk-rs-wasm-js/dist/ (built by the
# wasm-js build script, which needs wasm-pack in ./bin/).
#
# Setup required (one-time):
#   - Trusted Publisher registered on npmjs.com for this workflow:
#     https://docs.npmjs.com/trusted-publishers
#     Repository: ObjectiveAI/objectiveai
#     Workflow filename: publish-objectiveai-sdk-js.yml
#     No NPM_TOKEN secret is needed — OIDC handles authentication.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: pnpm publish
    runs-on: ubuntu-latest
    # `id-token: write` lets the runner request the OIDC token that
    # npm exchanges for a short-lived publish credential when the
    # repo is registered as a Trusted Publisher.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        # Version is read from `packageManager` in package.json
        # (pnpm@10.x). Don't pin here or the action errors with
        # ERR_PNPM_BAD_PM_VERSION on mismatch.

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishers requires Node >= 22.14.0 and
          # npm >= 11.5.1 (auto-installed via `npm install -g npm`
          # below to be safe — the default npm bundled with Node 22
          # may lag the Trusted Publishing-aware version).
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a Trusted-Publishing-aware version
        run: npm install -g npm@latest

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build wasm + js
        run: |
          # Install the pinned wasm-pack into ./bin/ (the wasm-js build
          # expects it there). The root build.sh inlines this for the full
          # build; here we only need wasm-pack for the wasm leg.
          WASM_PACK_VERSION=$(sed -n 's/^wasm-pack *= *"\(.*\)"/\1/p' Cargo.toml)
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --root .
          bash objectiveai-sdk-rs-wasm-js/build.sh
          bash objectiveai-sdk-js/build.sh

      - name: pnpm publish
        working-directory: objectiveai-sdk-js
        # No NODE_AUTH_TOKEN — pnpm/npm pick up the OIDC token from
        # the runner's id-token write permission and exchange it
        # with npmjs.com for a short-lived publish credential.
        # --provenance attaches the SLSA build attestation that
        # Trusted Publishing emits automatically.
        run: pnpm publish --access public --no-git-checks --provenance
