name: Build SDK runner leg and upload artifact
description: Build one PyInstaller SDK runner (claude-agent-sdk or codex-sdk) for this leg's platform and upload it as a workflow artifact for the per-platform packaging job to bundle into a zip. The api spawns these from <OBJECTIVEAI_DIR>/bin/ at runtime; they are no longer embedded.

inputs:
  runner:
    description: The sdk-runner crate directory and binary base name (e.g. objectiveai-claude-agent-sdk-runner).
    required: true
  asset:
    description: Name of the workflow artifact (and staged filename) for this runner binary (e.g. objectiveai-linux-x86_64-claude-runner).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        # Pin Python so the PyInstaller fingerprint stays stable across
        # runner OS versions (same pin the other legs used).
        python-version: '3.13'
    - name: Build runner
      shell: bash
      # No --target: build.sh defaults to the host triple, which is what
      # this platform's zip wants.
      run: bash "${{ inputs.runner }}/build.sh" --release
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage runner binary
      shell: bash
      # build.sh writes embed/<host-target>/release/<runner>[.exe]; the
      # host triple varies per runner OS, so locate the single built
      # binary rather than hardcoding the triple.
      run: |
        BUILT=$(find "${{ inputs.runner }}/embed" -type f \( -name "${{ inputs.runner }}" -o -name "${{ inputs.runner }}.exe" \) | head -n 1)
        if [ -z "$BUILT" ]; then
          echo "ERROR: no built runner binary found under ${{ inputs.runner }}/embed" >&2
          exit 1
        fi
        cp "$BUILT" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
