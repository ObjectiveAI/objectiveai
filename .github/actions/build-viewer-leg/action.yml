name: Build Viewer leg and upload artifact
description: Set up toolchains, build the standalone objectiveai-viewer binary (single self-contained executable, no installer bundle) for this leg's platform, and upload it as a workflow artifact for the per-platform packaging job to bundle into a zip.

inputs:
  asset:
    description: Name of the workflow artifact (and staged filename) for this leg's binary (e.g. objectiveai-linux-x86_64-viewer).
    required: true
  src_name:
    description: Filename of the built binary inside ~/.objectiveai/bin/ (objectiveai-viewer or objectiveai-viewer.exe).
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: pnpm/action-setup@v4
      with:
        # Match `packageManager` in the root package.json so workspace
        # resolution stays consistent with local installs.
        version: 10.25.0
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install Linux Tauri deps
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev
    - name: Build Viewer
      shell: bash
      run: bash objectiveai-viewer/install.sh
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage release binary
      shell: bash
      run: cp "$HOME/.objectiveai/bin/${{ inputs.src_name }}" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
