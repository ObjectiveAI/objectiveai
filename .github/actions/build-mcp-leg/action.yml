name: Build MCP leg and upload artifact
description: Set up the Rust toolchain, build the standalone objectiveai-mcp binary (the MCP server wrapper around the cli, published from the objectiveai-mcp crate) for this leg's platform, and upload it as a workflow artifact for the per-platform packaging job to bundle into a zip.

inputs:
  asset:
    description: Name of the workflow artifact (and staged filename) for this leg's binary (e.g. objectiveai-linux-x86_64-mcp).
    required: true
  src_name:
    description: Filename of the built binary inside ~/.objectiveai/ (objectiveai-mcp or objectiveai-mcp.exe).
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Build MCP
      shell: bash
      run: bash objectiveai-mcp/install.sh
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage release binary
      shell: bash
      run: cp "$HOME/.objectiveai/bin/${{ inputs.src_name }}" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
