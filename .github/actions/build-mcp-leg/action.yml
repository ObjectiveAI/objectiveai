name: Build MCP leg and publish to release
description: Set up the Rust toolchain, build the standalone objectiveai-mcp binary (the MCP server wrapper around the cli, published from the objectiveai-mcp-cli crate) for this leg's platform, upload it as an artifact and append it to the GitHub Release.

inputs:
  asset:
    description: Filename of the released asset (e.g. objectiveai-linux-x86_64-mcp).
    required: true
  src_name:
    description: Filename of the built binary inside ~/.objectiveai/ (objectiveai-mcp or objectiveai-mcp.exe).
    required: true
  version:
    description: The version string (without leading "v") used in the release tag.
    required: true
  repository:
    description: The owner/repo slug for `gh release upload`.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Build MCP
      shell: bash
      run: bash objectiveai-mcp-cli/install.sh
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage release binary
      shell: bash
      run: cp "$HOME/.objectiveai/bin/${{ inputs.src_name }}" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
    - name: Upload asset to release
      # Same upload-as-you-finish pattern as build-cli-leg /
      # build-api-leg / build-viewer-leg: each leg appends its asset
      # the moment it's built, no cross-leg gating.
      shell: bash
      run: |
        gh release upload "v${{ inputs.version }}" "${{ inputs.asset }}" \
          --clobber \
          --repo "${{ inputs.repository }}"
