name: Build CLI leg and upload artifact
description: Set up the Rust toolchain, build the CLI for this leg's platform, and upload the binary as a workflow artifact for the per-platform packaging job to bundle into a zip.

inputs:
  asset:
    description: Name of the workflow artifact (and staged filename) for this leg's binary (e.g. objectiveai-linux-x86_64).
    required: true
  src_name:
    description: Filename of the built binary inside ~/.objectiveai/bin/ (objectiveai or objectiveai.exe).
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Build CLI
      shell: bash
      # GITHUB_TOKEN: postgresql_embedded's build script queries the
      # GitHub API for the bundled postgres archive; unauthenticated
      # requests from shared runners intermittently 403 on rate
      # limits. The crate authenticates when GITHUB_TOKEN is set.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bash objectiveai-cli/install.sh
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage release binary
      shell: bash
      run: cp "$HOME/.objectiveai/bin/${{ inputs.src_name }}" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
