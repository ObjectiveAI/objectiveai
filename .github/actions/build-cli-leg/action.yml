name: Build CLI leg and publish to release
description: Set up the Rust toolchain, build the CLI for this leg's platform, upload the binary as an artifact and append it to the GitHub Release.

inputs:
  asset:
    description: Filename of the released asset (e.g. objectiveai-linux-x86_64).
    required: true
  src_name:
    description: Filename of the built binary inside ~/.objectiveai/bin/ (objectiveai or objectiveai.exe).
    required: true
  version:
    description: The version string (without leading "v") used in the release tag.
    required: true
  repository:
    description: The owner/repo slug for `gh release upload`.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Build CLI
      shell: bash
      # GITHUB_TOKEN: postgresql_embedded's build script queries the
      # GitHub API for the bundled postgres archive; unauthenticated
      # requests from shared runners intermittently 403 on rate
      # limits. The crate authenticates when GITHUB_TOKEN is set.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bash objectiveai-cli/install.sh
    - name: Dump build logs on failure
      if: failure()
      shell: bash
      run: |
        shopt -s nullglob
        for log in .logs/build/*.txt; do
          echo "::group::$log"
          cat "$log"
          echo "::endgroup::"
        done
    - name: Stage release binary
      shell: bash
      run: cp "$HOME/.objectiveai/bin/${{ inputs.src_name }}" "${{ inputs.asset }}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.asset }}
        path: ${{ inputs.asset }}
        if-no-files-found: error
    - name: Upload asset to release
      # Each leg appends its single asset to the release the moment this
      # leg finishes building — no cross-leg gating. `--clobber` keeps
      # re-runs idempotent. GH_TOKEN is provided by the calling job's `env:`.
      shell: bash
      run: |
        gh release upload "v${{ inputs.version }}" "${{ inputs.asset }}" \
          --clobber \
          --repo "${{ inputs.repository }}"
