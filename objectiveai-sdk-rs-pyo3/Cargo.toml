[package]
name = "objectiveai-sdk-rs-pyo3"
version = "2.1.3"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "PyO3 bindings for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
keywords = ["llm", "ai", "swarm", "python"]
publish = false

[lib]
name = "_pyo3"
crate-type = ["cdylib"]

[dependencies]
arbitrary = "1.4.2"
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.1.3", default-features = false }
# abi3-py310: one wheel per platform supports CPython 3.10+ via the stable ABI.
# Eliminates the per-Python-version build matrix on PyPI publish.
pyo3 = { version = "0.28", features = ["abi3-py310"] }
pythonize = "0.28"
rand = "0.9.2"
rust_decimal = { version = "1.40.0", features = ["serde-float"] }
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
