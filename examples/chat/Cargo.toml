[package]
name = "diverge-example-chat"
version = "0.1.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "An example Diverge tool container: a chat between a person and the agents attached to it, with a live web frontend"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
# The SDK, by path: the container's contract with the proxy beside it
# (registration, secrets, the daemon, Postgres), the caller the daemon
# attests on every MCP request and every frontend request, and the
# daemon's endpoints the chat reads agents and images through.
diverge-sdk = { path = "../../diverge-sdk-rs" }
# The program's door: an HTTP server on the loopback the proxy dials,
# `/register`, the secrets' two paths, the MCP server at `/mcp`, and
# the frontend beneath `/frontend`, its live sockets included.
axum = { version = "0.8.9", features = ["ws"] }
# The MCP server, over Streamable HTTP; the same version the SDK's
# content blocks and attestation are written against.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
# Each tool's parameters state their own JSON Schema; `--schema`
# states the arguments'.
schemars = { version = "1.2.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# The messages: the tool's database, through the proxy's loopback
# pgwire. `chrono` for when each was written.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
# The list stream read to its `listed`, and a socket's two halves.
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
# The runtime under the listener, the lazily made pool and daemon
# connection, the fan-out to open sockets, and the task each
# notification's answer is read on.
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt-multi-thread", "sync", "macros"] }
