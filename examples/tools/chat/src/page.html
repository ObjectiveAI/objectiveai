<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --ink: #101418;
    --raised: #182028;
    --line: #2a3540;
    --text: #e4e9ee;
    --dim: #8c98a4;
    --user: #f2b84b;
    --agent: #4fd1c5;
    --error: #e0604f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--ink);
    color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  header.top h1 { margin: 0; font-size: 16px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid currentColor;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    white-space: nowrap;
  }
  .badge.user { color: var(--user); }
  .badge.agent { color: var(--agent); }
  .badge.dim { color: var(--dim); }
  nav.tabs {
    display: flex;
    gap: 2px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  nav.tabs button {
    padding: 8px 14px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--dim);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { color: var(--agent); border-bottom-color: var(--agent); }
  nav.tabs .unseen::after { content: " ●"; color: var(--user); }
  main { flex: 1; min-height: 0; display: flex; }
  section.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section.pane[hidden] { display: none; }
  .who {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  details.image { padding: 0 16px; border-bottom: 1px solid var(--line); }
  details.image summary { padding: 6px 0; color: var(--dim); cursor: pointer; }
  details.image pre {
    max-height: 30vh;
    overflow: auto;
    margin: 0 0 10px;
    padding: 10px;
    background: var(--raised);
    border-radius: 6px;
    white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
  }
  .log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 72ch; }
  .message.user { align-self: flex-end; }
  .message .meta { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; font-size: 12px; color: var(--dim); }
  .message.user .meta { justify-content: flex-end; }
  .message .body {
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--raised);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .message.user .body { border: 1px solid color-mix(in srgb, var(--user) 50%, transparent); }
  .message.agent .body { border: 1px solid color-mix(in srgb, var(--agent) 50%, transparent); }
  .note { color: var(--dim); text-align: center; font-size: 12px; }
  .note.error { color: var(--error); }
  form.write { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  form.write textarea {
    flex: 1;
    min-height: 40px;
    max-height: 30vh;
    resize: vertical;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--raised);
    color: var(--text);
    font: inherit;
  }
  form.write button {
    padding: 0 18px;
    border: 0;
    border-radius: 8px;
    background: var(--agent);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  form.write button:disabled { opacity: 0.4; cursor: default; }
  .empty { margin: auto; color: var(--dim); }
</style>
</head>
<body>
<header class="top">
  <h1>Chat</h1>
  <span id="me" class="badge user">…</span>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="panes"><p class="empty">Reading the agents…</p></main>
<script>
"use strict";

// One badge: a pill of text in a role's colour.
function badge(text, role, title) {
  const span = document.createElement("span");
  span.className = "badge " + role;
  span.textContent = text;
  if (title) span.title = title;
  return span;
}

// A person, as a badge's words: the subject, with the issuer beside.
function personWords(issuer, subject) {
  return subject + " @ " + issuer;
}

// An agent's badges: its name if it has one, its template's first
// eight characters and its index, and its image's name.
function agentBadges(agent) {
  const badges = [];
  if (agent.name) badges.push(badge(agent.name, "agent"));
  badges.push(badge(agent.template.slice(0, 8) + " #" + agent.index, "agent", "template " + agent.template + ", index " + agent.index));
  const image = agent.document ? agent.document.name : "no DIVERGE.md";
  badges.push(badge("image: " + image, "dim", agent.digest));
  return badges;
}

// One message, drawn: its author's badge, when it was written, and
// what it says.
function drawMessage(message, agent) {
  const item = document.createElement("div");
  item.className = "message " + message.author;
  const meta = document.createElement("div");
  meta.className = "meta";
  if (message.author === "user") {
    meta.append(badge(personWords(message.issuer, message.subject), "user"));
  } else {
    meta.append(badge(message.name || agent.name || agent.template.slice(0, 8) + " #" + agent.index, "agent"));
  }
  const when = document.createElement("span");
  when.textContent = new Date(message.created).toLocaleString();
  meta.append(when);
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = message.body;
  item.append(meta, body);
  return item;
}

// A note in the conversation: the socket's state, or an error.
function note(text, error) {
  const p = document.createElement("p");
  p.className = "note" + (error ? " error" : "");
  p.textContent = text;
  return p;
}

// One tab: its conversation with one agent, over a socket of its own,
// opened again a moment after it closes.
class Conversation {
  constructor(agent, button, pane) {
    this.agent = agent;
    this.button = button;
    this.pane = pane;
    this.shown = false;
    const who = document.createElement("div");
    who.className = "who";
    who.append(...agentBadges(agent));
    const image = document.createElement("details");
    image.className = "image";
    const summary = document.createElement("summary");
    summary.textContent = "Image info";
    const pre = document.createElement("pre");
    pre.textContent = agent.document
      ? JSON.stringify({ name: agent.document.name, frontend: !!agent.document.frontend, schema: agent.document.schema }, null, 2) + "\n\n" + agent.document.body
      : "The image ships no DIVERGE.md: " + agent.digest;
    image.append(summary, pre);
    this.log = document.createElement("div");
    this.log.className = "log";
    const form = document.createElement("form");
    form.className = "write";
    this.input = document.createElement("textarea");
    this.input.placeholder = "Write to " + (agent.name || "the agent") + " — Enter sends, Shift+Enter is a new line";
    this.send = document.createElement("button");
    this.send.type = "submit";
    this.send.textContent = "Send";
    this.send.disabled = true;
    form.append(this.input, this.send);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      this.write();
    });
    this.input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        this.write();
      }
    });
    pane.append(who, image, this.log, form);
    this.open();
  }

  // The socket: the history replaces the log, every message after it is
  // added, and a close opens it again two seconds later.
  open() {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/frontend/ws?template=" + encodeURIComponent(this.agent.template) + "&index=" + this.agent.index;
    const socket = new WebSocket(url);
    this.socket = socket;
    socket.addEventListener("open", () => { this.send.disabled = false; });
    socket.addEventListener("message", (event) => {
      const said = JSON.parse(event.data);
      if (said.type === "history") {
        this.log.replaceChildren(...said.messages.map((message) => drawMessage(message, this.agent)));
        if (said.messages.length === 0) this.log.append(note("No messages yet."));
        this.bottom();
      } else if (said.type === "message") {
        this.log.querySelector(".note:not(.error)")?.remove();
        this.log.append(drawMessage(said.message, this.agent));
        this.bottom();
        if (!this.shown && said.message.author === "agent") this.button.classList.add("unseen");
      } else if (said.type === "lagged") {
        socket.close();
      } else if (said.type === "error") {
        this.log.append(note(said.error, true));
        this.bottom();
      }
    });
    socket.addEventListener("close", () => {
      this.send.disabled = true;
      if (this.socket === socket) setTimeout(() => this.open(), 2000);
    });
  }

  // The person's message, sent on the socket; the server shows it back
  // once it is kept.
  write() {
    const text = this.input.value;
    if (!text.trim() || this.socket.readyState !== WebSocket.OPEN) return;
    this.socket.send(text);
    this.input.value = "";
  }

  bottom() {
    this.log.scrollTop = this.log.scrollHeight;
  }

  show(on) {
    this.shown = on;
    this.pane.hidden = !on;
    this.button.classList.toggle("on", on);
    if (on) {
      this.button.classList.remove("unseen");
      this.bottom();
      this.input.focus();
    }
  }
}

async function start() {
  const me = await fetch("api/me").then((answer) => answer.json());
  const meBadge = document.getElementById("me");
  meBadge.textContent = me.identity ? personWords(me.identity.issuer, me.identity.subject) : "unknown";
  if (me.scope) meBadge.title = "scope " + me.scope;
  const listed = await fetch("api/agents").then((answer) => answer.json());
  const tabs = document.getElementById("tabs");
  const panes = document.getElementById("panes");
  if (listed.error) {
    panes.replaceChildren(note(listed.error, true));
    return;
  }
  if (listed.agents.length === 0) {
    panes.replaceChildren(note("No agent is attached to this chat."));
    return;
  }
  panes.replaceChildren();
  const conversations = listed.agents.map((agent) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = agent.name || agent.template.slice(0, 8) + " #" + agent.index;
    const pane = document.createElement("section");
    pane.className = "pane";
    pane.hidden = true;
    tabs.append(button);
    panes.append(pane);
    return new Conversation(agent, button, pane);
  });
  const choose = (chosen) => conversations.forEach((conversation) => conversation.show(conversation === chosen));
  conversations.forEach((conversation) => conversation.button.addEventListener("click", () => choose(conversation)));
  choose(conversations[0]);
}

start().catch((error) => {
  document.getElementById("panes").replaceChildren(note(String(error), true));
});
</script>
</body>
</html>
