[package]
name = "objectiveai-mcp-proxy"
version = "2.0.3"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.22.1"
blake3 = { version = "1.8.5", default-features = false }
chacha20poly1305 = "0.10.1"
dashmap = "6.1.0"
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3.32"
sse-stream = "0.2.3"
indexmap = { version = "2.13.0", features = ["serde"] }
# objectiveai brings the in-tree MCP client (Client / Connection / wire types).
# default-features = false skips the heavy filesystem feature (vendored libgit2)
# so this crate stays cheap to build.
objectiveai = { path = "../objectiveai-rs", version = "2.0.3", default-features = false, features = ["mcp"] }
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
test-upstream = { path = "test-upstream", version = "2.0.3" }
rmcp = { version = "0.16.0", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
