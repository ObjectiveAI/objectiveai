[package]
name = "objectiveai-mcp-proxy"
version = "2.2.11"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "MCP (Model Context Protocol) proxy server for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-mcp-proxy"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "mcp"]
publish = true

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.22.1"
dashmap = "6.1.0"
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3.32"
sse-stream = "0.2.3"
indexmap = { version = "2.13.0", features = ["serde"] }
# objectiveai brings the in-tree MCP client (Client / Connection / wire types).
# default-features = false skips the heavy filesystem feature (vendored libgit2)
# so this crate stays cheap to build.
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.2.11", default-features = false, features = ["mcp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
