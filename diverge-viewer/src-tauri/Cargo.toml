[package]
name = "diverge-viewer"
version = "0.1.0"
edition = "2024"
description = "The Diverge viewer"
publish = false

[dependencies]
# The seams. One crate for the wire, the daemon's endpoints and the
# provider's: the daemon's own types for agents, the provider's own for
# a machine's volumes and its tool rooms, and the caller half of each so
# a `WireDaemon` and a `WireMachines` have nothing to add but themselves.
# No features: every half compiles for every dependent.
# The SDK's `tauri_proxy` runner holds the one connection to the daemon
# for the page, and `identities` presents the identity it dials as.
diverge-sdk = { path = "../../diverge-sdk-rs", features = ["tauri-proxy", "identities"] }
# The one `viewer.yaml` the app reads: which daemon, and as whom; a
# crate beside this one so the CLI reads the document with the same
# type.
diverge-viewer-config = { path = "../config" }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
# The agent door served on this machine's loopback, for local agents you
# already run: MCP over Streamable HTTP behind a bearer token per agent,
# compared in constant time.
axum = "0.8.9"
subtle = "2.6"
# The room program, seals and records: ours (../room).
diverge-viewer-room = { path = "../room" }
# Invites travel as text.
base64 = "0.22"
# Your account: twelve BIP-39 recovery words, made at first run and kept
# sealed in your keys file under a key drawn (HKDF) from this Mac's device
# key; whatever held them is wiped from memory.
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.2"
hex = "0.4"

tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3.32"
async-trait = "0.1.89"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
# Settings are checked against the JSON Schema each agent image ships in its
# DIVERGE.md. Nothing is fetched: a schema here refers only to itself.
jsonschema = { version = "0.60.1", default-features = false }
indexmap = { version = "2.14.0", features = ["serde"] }
dirs = "6.0.0"
# Our view types write their own TypeScript: `cargo test` exports them.
ts-rs = { version = "11", features = ["serde-json-impl"] }

[features]
default = ["stand-in"]
# The stand-in daemon and rooms: their seeded past and staged scenes, so the
# app runs whole on one computer. Without it the app runs with nothing
# answering for the daemon, machines or rooms yet, and says so.
stand-in = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
# Virtual time, so the preview snapshot can catch a run part-way through.
tokio = { version = "1.50.0", features = ["full", "test-util"] }
# The door served over real HTTP, reached by the MCP client a local agent uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
