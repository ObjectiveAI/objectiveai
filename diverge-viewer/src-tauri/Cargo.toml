[package]
name = "diverge-viewer"
version = "0.1.0"
edition = "2024"
description = "The Diverge viewer"
publish = false

[dependencies]
# The wire. Rust holds the one connection to the daemon and speaks the
# frames for the page, which asks it frame by frame through the proxy
# commands and reads every answer with the TypeScript SDK. The
# commands and the link are the SDK's own `tauri_proxy`.
diverge-sdk = { path = "../../diverge-sdk-rs", features = ["tauri-proxy", "identities"] }
# The one `viewer.yaml` the app reads: which daemon, and as whom; a
# crate beside this one so the CLI reads the document with the same
# type.
diverge-viewer-config = { path = "../config" }

tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.39", default-features = false, features = ["std", "serde", "clock"] }
# Our view types write their own TypeScript: `cargo test` exports them.
ts-rs = { version = "11", features = ["serde-json-impl"] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
