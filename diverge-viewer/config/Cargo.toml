[package]
name = "diverge-viewer-config"
version = "0.1.0"
edition = "2024"
description = "The one viewer.yaml the Diverge viewer reads: the document as Rust, so the viewer and the CLI read it with one type"
publish = false

[dependencies]
# The default daemon address: one port above the provider's.
diverge-sdk = { path = "../../diverge-sdk-rs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", features = ["fs"] }
