[package]
name = "objectiveai-sdk-cffi"
version = "2.0.5"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "C FFI bindings for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "ffi"]
publish = true

[lib]
name = "objectiveai_cffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
arbitrary = "1.4.2"
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.0.5", default-features = false }
rand = "0.10.0"
rust_decimal = { version = "1.40.0", features = ["serde-float"] }
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
