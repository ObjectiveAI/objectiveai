[package]
name = "objectiveai-sdk"
version = "2.0.11"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "ObjectiveAI SDK, definitions, and utilities"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-sdk"
readme = "README.md"
keywords = ["llm", "ai", "swarm"]
publish = true
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "build.rs",
    "README.md",
    "LICENSE*",
    "schemas/*.json",
]

[features]
default = ["http", "filesystem", "env", "mcp", "cli", "viewer"]
http = ["dep:reqwest", "dep:reqwest-eventsource", "dep:eventsource-stream", "dep:futures", "dep:tokio", "dep:backoff", "dep:tokio-tungstenite", "dep:dashmap"]
filesystem = ["dep:dirs", "dep:jaq-core", "dep:jaq-std", "dep:jaq-json", "dep:sha2", "dep:tokio", "dep:futures", "dep:mime_guess", "dep:git2", "dep:rusqlite", "dep:regex", "dep:zip"]
env = []
mcp = ["dep:reqwest", "dep:backoff", "dep:futures-util", "dep:tokio", "dep:tokio-util"]
cli = ["filesystem", "dep:tokio", "dep:clap"]
cli-executor = ["cli", "dep:futures", "dep:dashmap"]
viewer = ["dep:tokio"]

[dependencies]
objectiveai-sdk-macros = { version = "2.0.11", path = "../objectiveai-sdk-rs-macros" }
base62 = { version = "2.2.4" }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = { version = "2.13.0", features = ["serde"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_128", "alloc"] }
rust_decimal = { version = "1.40.0", features = ["serde-float", "macros"] }
jmespath = { version = "0.5.0" }
thiserror = {  version = "2.0.18" }
base64 = { version = "0.22.1" }
chrono = { version = "=0.4.39", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
json-escape = { version = "0.3.1" }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"], optional = true }
reqwest-eventsource = { version = "0.6.0", optional = true }
eventsource-stream = { version = "0.2.3", optional = true }
futures = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", optional = true }
backoff = { version = "0.4.0", features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
dashmap = { version = "6.1", optional = true }
tokio-util = { version = "0.7.18", features = ["io"], optional = true }
serde_path_to_error = { version = "0.1.20" }
starlark = { version = "0.13.0" }
anyhow = { version = "1.0.102" }
rand = { version = "0.9.2" }
schemars = { version = "1.2.1", features = ["indexmap2", "chrono04", "uuid1"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"], optional = true }
dirs = { version = "6.0.0", optional = true }
jaq-core = { version = "2.2.1", optional = true }
jaq-std = { version = "2.1.2", optional = true }
jaq-json = { version = "1.1.3", features = ["serde_json"], optional = true }
sha2 = { version = "0.10.9", optional = true }
mime2ext = { version = "0.1.54" }
mime_guess = { version = "2.0.5", optional = true }
tokio = { version = "1.51.1", features = ["fs", "time", "sync", "rt", "io-util", "macros", "process"], optional = true }
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2"], optional = true }
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }
regex = { version = "1.12.3", optional = true }
zip = { version = "2.4.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.10"
walkdir = "2.5.0"
wiremock = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.22.0", features = ["v4", "serde", "js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
