[package]
name = "objectiveai-sdk"
version = "2.2.10"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "ObjectiveAI SDK, definitions, and utilities"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-sdk"
readme = "README.md"
keywords = ["llm", "ai", "swarm"]
publish = true
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[features]
default = ["http", "env", "mcp", "cli", "cli-executor", "cli-listener"]
http = ["mcp", "dep:reqwest", "dep:reqwest-eventsource", "dep:eventsource-stream", "dep:futures", "dep:tokio", "dep:backoff", "dep:tokio-tungstenite", "dep:dashmap"]
env = []
mcp = ["dep:reqwest", "dep:backoff", "dep:futures-util", "dep:tokio", "dep:tokio-util", "dep:regex", "dep:rmcp"]
cli = ["mcp", "dep:clap", "dep:humantime"]
cli-executor = ["cli", "mcp", "dep:tokio", "dep:futures", "dep:dashmap", "dep:dirs", "dep:tokio-tungstenite"]
cli-listener = ["cli", "dep:tokio", "dep:futures", "dep:tokio-tungstenite"]
lockfile = ["dep:tokio", "dep:nix", "dep:windows-sys", "dep:dashmap", "dep:hostname"]
subprocess-reaper = ["dep:tokio", "dep:nix", "dep:windows-sys"]

[dependencies]
objectiveai-sdk-macros = { version = "2.2.10", path = "../objectiveai-sdk-rs-macros" }
base62 = { version = "2.2.4" }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = { version = "2.13.0", features = ["serde"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "raw_value"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_128", "alloc"] }
rust_decimal = { version = "1.40.0", features = ["serde-float", "macros"] }
jmespath = { version = "0.5.0" }
thiserror = {  version = "2.0.18" }
base64 = { version = "0.22.1" }
chrono = { version = "=0.4.39", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
json-escape = { version = "0.3.1" }
sha2 = { version = "0.10.9" }
hex = { version = "0.4.3" }
hostname = { version = "0.4", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"], optional = true }
reqwest-eventsource = { version = "0.6.0", optional = true }
eventsource-stream = { version = "0.2.3", optional = true }
futures = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", optional = true }
backoff = { version = "0.4.0", features = ["tokio"], optional = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
dashmap = { version = "6.1", optional = true }
tokio-util = { version = "0.7.18", features = ["io"], optional = true }
dirs = { version = "6.0.0", optional = true }
regex = { version = "1.11", optional = true }
# Only `rmcp::model` is needed (for the mcp <-> rmcp conversions in
# src/mcp/rmcp_bridge.rs); `model` is unconditional and its optional-dep
# uses are feature-gated, so no features are required. Gated behind `mcp`.
rmcp = { version = "1.7", default-features = false, optional = true }
serde_path_to_error = { version = "0.1.20" }
starlark = { version = "0.13.0" }
anyhow = { version = "1.0.102" }
rand = { version = "0.9.2" }
schemars = { version = "1.2.1", features = ["indexmap2", "chrono04", "uuid1"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }
mime2ext = { version = "0.1.54" }
tokio = { version = "1.51.1", features = ["fs", "time", "sync", "rt", "io-util", "io-std", "macros", "process"], optional = true }

[dev-dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.10"
walkdir = "2.5.0"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "inotify", "event"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_RestartManager", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Registry"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.22.0", features = ["v4", "serde", "js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
