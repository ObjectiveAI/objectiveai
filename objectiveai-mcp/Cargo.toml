[package]
name = "objectiveai-mcp"
version = "2.0.11"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "MCP (Model Context Protocol) server for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-mcp"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "mcp"]
publish = true

[features]
default = []
rustpython = ["objectiveai-cli/rustpython"]
systempython = ["objectiveai-cli/systempython"]

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3.32"
json-escape = { version = "0.3.1" }
objectiveai-cli = { path = "../objectiveai-cli", version = "2.0.11", default-features = false }
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.0.11" }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
rmcp = { version = "0.16.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
http = "1.4.0"
