[package]
name = "objectiveai-mcp"
version = "2.0.0"
edition = "2024"

[features]
default = []
filesystem = ["glob", "regex", "walkdir", "serde_json", "pathdiff", "indexmap", "base64"]
cli = ["dep:objectiveai-cli", "serde_json"]
cli-viewer = ["cli", "objectiveai-cli/viewer"]
cli-rustpython = ["cli", "objectiveai-cli/rustpython"]
cli-systempython = ["cli", "objectiveai-cli/systempython"]

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = { version = "0.22", optional = true }
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3"
glob = { version = "0.3", optional = true }
indexmap = { version = "2.13.0", features = ["serde"], optional = true }
# Direct dep (no features) so cargo invalidates objectiveai-mcp whenever
# objectiveai-rs changes, matching what fingerprint.sh already tracks.
# Disabling default features avoids pulling in `filesystem`'s vendored
# libgit2, which would require a cross C toolchain for the musl build.
# `mcp` opts in to the in-tree MCP client (Client/Connection/Error etc).
objectiveai = { path = "../objectiveai-rs", version = "2.0.0", default-features = false, features = ["mcp"] }
objectiveai-cli = { path = "../objectiveai-cli", version = "2.0.0", optional = true, default-features = false }
pathdiff = { version = "0.2", optional = true }
regex = { version = "1", optional = true }
rmcp = { version = "0.16.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"], optional = true }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = { version = "2", optional = true }
