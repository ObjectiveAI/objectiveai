[package]
name = "diverge-container-proxy-new"
version = "2.3.0"
edition = "2024"
authors = ["Diverge <admin@diverge.network>"]
description = "The proxy inside a Diverge container — one WebSocket to the provider's server, every scope of the container proxy protocol answered, the program's own surfaces on the loopback"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://diverge.network"
publish = false

[dependencies]
# `ws` on top of the defaults: one listener takes the server's one
# upgrade, and another serves the program's HTTP surface and the
# agent's MCP server.
axum = { version = "0.8.9", features = ["ws"] }
# What a frame's payload is carried as — the frame's own bytes, not
# copied.
bytes = { version = "1.11.1", default-features = false }
# Path-only: this crate rides the workspace and is never published, so
# the SDK is named by where it lives rather than by a version pin
# version.sh would have to chase. `server`: the frame-level session
# that reads the one connection and the scope handles that answer it,
# and the container proxy protocol's own frames.
diverge-provider-sdk = { path = "../diverge-provider-sdk-rs", features = ["server"] }
# The inside of the container, stated once: the loopback ports the
# program dials, and the agent server's own contract.
diverge-container-proxy-sdk = { path = "../diverge-container-proxy-sdk-rs" }
# `Stream` on a body, the fan-out's `join_all`, and the binds joined.
futures-util = { version = "0.3.33", default-features = false }
# The filesystem watch behind a tree: inotify, on the images this
# runs in. The daemon's line.
notify = "8.2"
# The MCP server the agent talks to: a compliant Streamable HTTP
# server whose handler is this crate's relay. And the MCP client a
# tool container's server is called through, over Streamable HTTP on
# the loopback.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
# A refusal the far side sent, rendered whole into a tool result; the
# errors this crate mints in the protocol's one shape.
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
# The agent's server, dialed: each of its five calls is one HTTP call
# to the loopback. No TLS — it is the loopback. `json` reads a fate or
# an outcome; `stream` reads the loop's events as they land.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
# The loop's events, parsed out of that stream.
eventsource-stream = "0.2.3"
# The runtime under the listeners, built in main rather than
# attributed onto it. `macros` for the one `select!` the agent's
# driver turns on; `io-util` reads and writes the driver's socket;
# `time` paces an accept loop that keeps failing; `fs` opens and
# reads the files the server asks for.
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The FUSE mounts: files and directories the caller serves live,
# mounted by the proxy itself. Pure Rust — `fuser` talks to /dev/fuse
# and mounts through the syscall as the namespace's root. `libc` for
# the one open flag the trait hands over raw (`O_TRUNC`). The proxy is
# Unix, as the container is; it is built for nothing else.
fuser = { version = "0.18.0" }
libc = { version = "0.2.186" }
