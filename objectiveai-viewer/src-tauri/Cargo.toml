[package]
name = "objectiveai-viewer"
version = "2.2.16"
edition = "2024"

[features]
# default = [] stays empty: the cli's build.rs builds and embeds this
# crate, and the embedded build picks up only default features. The
# viewer no longer links objectiveai-cli at all — `cli_run` spawns the
# installed cli binary via the SDK's BinaryExecutor instead.
default = []
# Development mode: parse `--development-plugin` argv entries (the
# daemon passes the registration list at spawn; changes propagate by
# respawn) and watch the registered directories for hot reload.
# DELIBERATELY not a default (see above for why defaults stay empty).
# Enabled wherever the daemon-spawned binary is built: install.sh and
# the release zip jobs.
development = ["dep:clap", "dep:notify"]

[dependencies]
chrono = "=0.4.39"
dirs = "6.0.0"
dotenv = "0.15.0"
envconfig = "0.11.1"
eventsource-stream = "0.2.3"
futures = "0.3.32"
mime_guess = "2.0.5"
# Development mode only: argv parsing + file watching.
clap = { version = "4.6.0", features = ["derive"], optional = true }
notify = { version = "8.2.0", optional = true }
open = "5.3.2"
objectiveai-sdk = { version = "2.2.16", path = "../../objectiveai-sdk-rs", default-features = false, features = ["cli", "cli-executor", "daemon", "mcp", "machine", "lockfile", "gitrepo"] }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "stream"] }
semver = "1.0.28"
base64 = "0.22.1"
tar = "0.4.46"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
# `unstable` = the multi-webview APIs: raw WindowBuilder, child
# WebviewBuilder/add_child, Webview::reparent past its webview-window
# refusal — the per-tab content webviews ride all of them.
tauri = { version = "2.10.3", features = ["unstable"] }
# Chromium Embedded Framework — the browser-tab surface. Maintained by
# the Tauri team. `default-features = false` drops `sandbox` (which
# needs the bootstrap.exe/cdylib build pattern on Windows) and
# `build-util` (the macOS bundling tool, not needed at runtime).
#
# The FIRST build downloads ~150MB of Chromium SDK and compiles a C++
# wrapper with cmake. Set CEF_PATH to a persistent directory so a
# `cargo clean` does not re-fetch it.
cef = { version = "150.2.1", default-features = false }
# Direct dep purely so cargo propagates DEP_CEF_DLL_WRAPPER_CEF_DIR
# (the `links = "cef_dll_wrapper"` metadata) into our build.rs — cargo
# only sets DEP_ vars for DIRECT consumers of the links-emitting crate.
# Its types are all re-exported through `cef::sys`.
cef-dll-sys = { version = "150.2.1", default-features = false }
# The SAME crate cef-dll-sys's build script fetches with — driven at
# runtime with the same target and version, so the runtime a user
# downloads is the one the build linked against.
download-cef = "2.3"
# Profile directory names: one flat hashed segment per (identity, state
# key). Same hash the SDK content-addresses agents with.
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_128", "alloc"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }

[target."cfg(windows)".dependencies]
# - Win32_UI_Input_KeyboardAndMouse: the docking task's mouse-button
#   check (GetAsyncKeyState) — a dock must never commit while the OS
#   modal move loop still owns the dragged window.
# - Win32_Foundation + Win32_UI_WindowsAndMessaging: a browser tab's
#   CEF surface is a native child window, positioned with SetWindowPos
#   and re-homed across shell windows with SetParent.
# - Win32_System_LibraryLoader: AddDllDirectory, so the delay-loaded
#   libcef.dll resolves out of the fetched runtime directory.
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target."cfg(target_os = \"macos\")".dependencies]
# NSWindow::contentLayoutRect — the chrome bands are laid out against
# the part of the content view the titlebar does NOT float over. See
# `top_inset` in shell/native.rs for why that is not the whole window.
# Same 0.3.x wry itself depends on, so Cargo.lock unifies and this
# adds nothing transitively.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
