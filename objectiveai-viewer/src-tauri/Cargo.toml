[package]
name = "objectiveai-viewer"
version = "2.0.11"
edition = "2024"

[features]
# default = [] is critical: the embedded viewer that gets bundled into
# the cli binary picks up only default features. Enabling `cli` here
# would mean the cli's build.rs (which builds the viewer) links the
# viewer which links the cli back — a circular source dep. Keep cli
# out of defaults; standalone builds opt in explicitly via
# `cargo run --features cli`.
default = []
cli = ["dep:objectiveai-cli"]
cli-rustpython = ["cli", "objectiveai-cli/rustpython"]
cli-systempython = ["cli", "objectiveai-cli/systempython"]

[dependencies]
axum = "0.8.8"
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3.32"
hex = "0.4.3"
mime_guess = "2.0.5"
objectiveai-sdk = { version = "2.0.11", path = "../../objectiveai-sdk-rs", default-features = false, features = ["cli", "viewer"] }
objectiveai-cli = { version = "2.0.11", path = "../../objectiveai-cli", default-features = false, optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.50.0", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
