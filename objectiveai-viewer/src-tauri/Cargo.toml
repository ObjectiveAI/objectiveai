[package]
name = "objectiveai-viewer"
version = "2.0.3"
edition = "2024"

[dependencies]
axum = "0.8.8"
dotenv = "0.15.0"
envconfig = "0.11.1"
hex = "0.4.3"
objectiveai = { version = "2.0.3", path = "../../objectiveai-rs" }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.10.3", features = [] }
tokio = { version = "1.50.0", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
