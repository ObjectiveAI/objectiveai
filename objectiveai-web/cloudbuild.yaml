steps:
  # fetch submodules
  - name: gcr.io/cloud-builders/git
    args:
      - "submodule"
      - "update"
      - "--init"
      - "--recursive"
  # build image — ONLY public NEXT_PUBLIC_* build args (no secrets in image or logs)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=https://api.objectiveai.dev"
      - "--build-arg"
      - "NODE_ENV=production"
      - "--build-arg"
      - "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
      - "--build-arg"
      - "NEXT_PUBLIC_SONARLY_PROJECT_KEY=$_NEXT_PUBLIC_SONARLY_PROJECT_KEY"
      - "--build-arg"
      - "NEXT_PUBLIC_SONARLY_INGEST_POINT=$_NEXT_PUBLIC_SONARLY_INGEST_POINT"
      - "-t"
      - "us-docker.pkg.dev/$PROJECT_ID/objectiveai/objectiveai-web:latest"
      - "-f"
      - "objectiveai-web/Dockerfile"
      - "."
  # push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-docker.pkg.dev/$PROJECT_ID/objectiveai/objectiveai-web:latest"
  # deploy to Cloud Run — server config as runtime env, secrets from Secret Manager
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "objective-ai-web-main"
      - "--image"
      - "us-docker.pkg.dev/$PROJECT_ID/objectiveai/objectiveai-web:latest"
      - "--region"
      - "us-central1"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "NEXTAUTH_URL=https://objectiveai.dev,NODE_ENV=production,USER_IP_HEADER=x-forwarded-for,AUTH_GOOGLE_CLIENT_ID=$_AUTH_GOOGLE_CLIENT_ID,AUTH_GITHUB_CLIENT_ID=$_AUTH_GITHUB_CLIENT_ID,AUTH_TWITTER_CLIENT_ID=$_AUTH_TWITTER_CLIENT_ID,AUTH_REDDIT_CLIENT_ID=$_AUTH_REDDIT_CLIENT_ID"
      - "--set-secrets"
      - "AUTH_GOOGLE_CLIENT_SECRET=auth-google-client-secret:latest,AUTH_GITHUB_CLIENT_SECRET=auth-github-client-secret:latest,AUTH_TWITTER_CLIENT_SECRET=auth-twitter-client-secret:latest,AUTH_REDDIT_CLIENT_SECRET=auth-reddit-client-secret:latest,NEXTAUTH_SECRET=nextauth-secret:latest,IP_RSA_PUBLIC_KEY=ip-rsa-public-key:latest"
images: ["us-docker.pkg.dev/$PROJECT_ID/objectiveai/objectiveai-web:latest"]
timeout: "2100s"
options:
  logging: "CLOUD_LOGGING_ONLY"
  # client IDs / NEXT_PUBLIC_* stay as trigger substitutions; the former
  # secret substitutions (_AUTH_*_CLIENT_SECRET, _NEXTAUTH_SECRET, etc.) are
  # no longer referenced — ALLOW_LOOSE tolerates them until they're removed
  # from the trigger.
  substitution_option: "ALLOW_LOOSE"
