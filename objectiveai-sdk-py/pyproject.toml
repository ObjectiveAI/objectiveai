[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "objectiveai-sdk"
version = "2.0.8"
description = "ObjectiveAI SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "ObjectiveAI", email = "admin@objectiveai.dev" },
]
keywords = ["objectiveai", "ai", "llm", "agents", "swarm", "judgment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
]

[project.urls]
Homepage = "https://objectiveai.dev"
Repository = "https://github.com/ObjectiveAI/objectiveai"
Issues = "https://github.com/ObjectiveAI/objectiveai/issues"

[tool.maturin]
manifest-path = "../objectiveai-sdk-rs-pyo3/Cargo.toml"
python-source = "."
module-name = "objectiveai_sdk._pyo3"
features = ["pyo3/extension-module"]
