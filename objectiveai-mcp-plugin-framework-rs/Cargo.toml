[package]
name = "objectiveai-mcp-plugin-framework"
version = "2.2.16"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "Plugin framework for ObjectiveAI MCP plugins"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-mcp-plugin-framework"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "mcp"]
publish = true

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
dashmap = "6.2.1"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
indexmap = { version = "2.14.0", features = ["serde"] }
objectiveai-sdk = { version = "2.2.16", path = "../objectiveai-sdk-rs", default-features = false, features = ["cli", "cli-executor"] }
rmcp = { version = "2.2.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["net", "rt"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
