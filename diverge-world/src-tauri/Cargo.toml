[package]
name = "diverge-world"
version = "0.1.0"
edition = "2024"
description = "Diverge World"
publish = false

[dependencies]
# The wire. Rust holds the one connection to the daemon and speaks the
# frames for the page, through the SDK's own `tauri_proxy` runner,
# which dials the daemon again as `viewer.yaml`'s `redial` says; the
# identity it presents is one of the root's `identities`.
diverge-sdk = { path = "../../diverge-sdk-rs", features = ["tauri-proxy", "identities"] }
# The viewer's own `viewer.yaml`: which daemon, as whom, and how it is
# dialled again.
diverge-viewer-config = { path = "../../diverge-viewer/config" }

tauri = { version = "2.10.3", features = [] }
# The system's save and folder dialogs a download asks where to put it
# with. Not Tauri's dialog plugin, whose versions require a newer Tauri.
rfd = "0.17.2"
# Downloads and uploads, between the disk and the wire in pieces
# (`transfer.rs`).
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync", "time"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
bytes = "1.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
