[package]
name = "objectiveai-laboratory"
version = "2.2.10"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "=0.4.39", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6.1.0"
dirs = "6.0.0"
flate2 = "1.1.9"
futures = "0.3.32"
indexmap = { version = "2.13", features = ["serde"] }
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.2.10", default-features = false, features = ["lockfile", "mcp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "rustls-tls", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tar = "0.4.46"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
uuid = { version = "1.22", features = ["v4"] }
zip = { version = "2.4.0", default-features = false, features = ["deflate"] }
