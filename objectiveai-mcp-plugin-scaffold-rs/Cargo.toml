[package]
name = "objectiveai-plugin-scaffold"
version = "2.2.13"
edition = "2024"
description = "Starting point for an ObjectiveAI MCP plugin written in Rust"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
# Plugins ship as container images built from a git tag, never as
# crates.
publish = false

[[bin]]
name = "objectiveai-plugin-scaffold"
path = "src/main.rs"

[dependencies]
# Everything that is the same for every ObjectiveAI plugin. It also
# re-exports `objectiveai_sdk`, `rmcp` and `sqlx`, so none of those are
# listed here — a second copy of any of them would be a different set
# of traits and would not fit the APIs above.
objectiveai-mcp-plugin-framework = "2.2.13"
# Only to consume the response stream from a CLI command.
futures = "0.3.33"
# `rmcp` is deliberately NOT a direct dependency: the framework
# re-exports the exact one it was built against, so the two can never
# skew into a `ToolRouter<S>` that does not fit `serve`. The
# `#[tool_router]`/`#[tool]` macros resolve through the `use` in
# `main.rs`.
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
# Matching the versions and TLS backend the rest of ObjectiveAI uses:
# rustls, so a plugin image needs no system OpenSSL.
reqwest = { version = "0.12.28", default-features = false, features = [
    "charset",
    "http2",
    "rustls-tls",
] }
serde_json = "1.0.151"
# `sync` is for the `OnceCell` guarding the table creation.
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
# Small, fast-enough image binary.
opt-level = "s"
strip = true
